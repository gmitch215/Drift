  - id: network-hosts-stale
    title: A service name maps to a stale address in the red hosts file and the connection is refused
    dimension: network
    instances: 2
    variants:
      - host: cache.internal
      - host: queue.internal
    runtime: python3
    program: |
      import os
      import socket
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      server = socket.socket()
      server.bind(("127.0.0.1", 0))
      server.listen(1)
      port = server.getsockname()[1]
      socket.create_connection(("{{host}}", port), timeout=5)
      print("connected")
    signature: "Connection refused"
    base:
      image: "python:3.12-slim"
    green:
      files:
        /etc/hosts: "127.0.0.1 localhost\n127.0.0.1 {{host}}\n"
    red:
      files:
        /etc/hosts: "127.0.0.1 localhost\n127.0.0.2 {{host}}\n"
    cause:
      dimension: network
      path: network.hosts.names
      attribute: hosts file
      direction: changed

