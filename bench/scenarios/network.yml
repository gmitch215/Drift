  - id: network-interface-missing
    title: The red container has no network interface that is up besides loopback
    dimension: network
    instances: 2
    variants:
      - svc: metrics
      - svc: agent
    runtime: python3
    program: |
      import os
      import socket
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      names = [
          name
          for _, name in socket.if_nameindex()
          if name != "lo" and open("/sys/class/net/%s/operstate" % name).read().strip() == "up"
      ]
      if not names:
          print("{{svc}}: no usable network interface besides lo")
          sys.exit(1)
      print("ok", names)
    signature: "no usable network interface"
    base:
      image: "python:3.12-slim"
    green:
      network: bridge
    red:
      network: none
    cause:
      dimension: network
      path: network.interfaces
      attribute: container network mode
      direction: changed
