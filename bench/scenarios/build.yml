schema: 1
templates:
  - id: build-npm-sbom-plain
    title: A build step runs an npm command the red npm does not have
    dimension: build
    instances: 1
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      npm sbom --help
    signature: "Unknown command"
    green:
      image: "node:20-slim"
    red:
      image: "node:16-slim"
    cause:
      dimension: build
      path: tool.npm.version
      attribute: npm version
      direction: lower
    bundle:
      - dimension: runtime
        path: tool.node.version
      - dimension: runtime
        path: env.NODE_VERSION
      - dimension: build
        path: env.YARN_VERSION
      - dimension: os
        path: os.release.VERSION_ID
      - dimension: os
        path: os.release.PRETTY_NAME
      - dimension: os
        path: tool.libc.version
      - dimension: userland
        path: tool.coreutils.version
    visible: false
    note: The capsule has no npm attribute; the node version that comes with it is visible.

  - id: build-lockfile-pin
    title: A lockfile pins a dependency release that dropped an API
    dimension: build
    instances: 2
    variants:
      - lib: widgetkit
        good: 1.4.2
        bad: 1.5.0
        gate: "1000"
        trials: "20"
      - lib: schemakit
        good: 2.9.1
        bad: 3.0.0
        gate: "450"
        trials: "40"
    gate: "{{gate}}"
    trials: "{{trials}}"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      ver=$(sed -n 's/^{{lib}}==//p' /etc/app/lock.txt)
      case "$ver" in
        {{bad}}) echo "ImportError: cannot import name legacy_api from {{lib}} ($ver)"; exit 1 ;;
      esac
      echo ok
    signature: "ImportError: cannot import name legacy_api"
    base:
      image: "debian:12-slim"
    green:
      files:
        /etc/app/lock.txt: "{{lib}}=={{good}}\n"
    red:
      files:
        /etc/app/lock.txt: "{{lib}}=={{bad}}\n"
    cause:
      dimension: build
      path: "deps.{{lib}}.version"
      attribute: locked release of {{lib}}
      direction: higher
    visible: false

  - id: build-npm-subcommand
    title: A build step runs an npm subcommand the red npm does not have
    dimension: build
    instances: 2
    variants:
      - cmd: "npm pkg get name"
        red_image: "node:16.0.0-slim"
      - cmd: "npm query ':root'"
        red_image: "node:16.13.0-slim"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      mkdir -p /tmp/p
      cd /tmp/p
      printf '{"name":"app","version":"1.0.0"}\n' > package.json
      {{cmd}}
    signature: "Unknown command"
    green:
      image: "node:20-slim"
    red:
      image: "{{red_image}}"
    cause:
      dimension: build
      path: tool.npm.version
      attribute: npm version
      direction: lower
    bundle:
      - dimension: runtime
        path: tool.node.version
      - dimension: runtime
        path: env.NODE_VERSION
      - dimension: build
        path: env.YARN_VERSION

  - id: build-pip-option
    title: A build step passes pip an option or command the red pip does not have
    dimension: build
    instances: 2
    variants:
      - cmd: "python3 -m pip inspect > /dev/null"
        sig: 'unknown command "inspect"'
      - cmd: 'python3 -m pip --python "$(command -v python3)" list > /dev/null'
        sig: "no such option: --python"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      {{cmd}}
      echo ok
    signature: "{{sig}}"
    green:
      image: "python:3.12-slim"
    red:
      image: "python:3.8.10-slim"
    cause:
      dimension: build
      path: tool.pip.version
      attribute: pip version
      direction: lower
    bundle:
      - dimension: runtime
        path: tool.python.version
      - dimension: runtime
        path: env.PYTHON_VERSION
      - dimension: build
        path: env.PYTHON_PIP_VERSION
    visible: false
    note: The capsule has no pip attribute; the python version that comes with it is visible.

  - id: build-cargo-manifest
    title: A Cargo manifest or lockfile is newer than the red cargo can read
    dimension: build
    instances: 2
    variants:
      - edition: "2024"
        lock: ""
        red_image: "rust:1.80-slim"
        sig: edition2024
      - edition: "2021"
        lock: "printf '# This file is automatically @generated by Cargo.\\n# It is not intended for manual editing.\\nversion = 4\\n\\n[[package]]\\nname = \"app\"\\nversion = \"0.1.0\"\\n' > Cargo.lock"
        red_image: "rust:1.77-slim"
        sig: "lock file version"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      mkdir -p /tmp/p/src
      cd /tmp/p
      printf '[package]\nname = "app"\nversion = "0.1.0"\nedition = "{{edition}}"\n' > Cargo.toml
      printf 'fn main() {}\n' > src/main.rs
      {{lock}}
      cargo tree --offline
    signature: "{{sig}}"
    base:
      env:
        CARGO_HOME: /tmp/cargo
    green:
      image: "rust:1.85-slim"
    red:
      image: "{{red_image}}"
    cause:
      dimension: build
      path: tool.rust.version
      attribute: cargo version
      direction: lower
    bundle:
      - dimension: runtime
        path: env.RUST_VERSION

  - id: build-make-feature
    title: A Makefile or make flag needs a newer GNU make than the red image ships
    dimension: build
    instances: 2
    variants:
      - write: 'printf "all:\n\t@echo built\n" > Makefile'
        flags: "--shuffle=random"
        sig: "unrecognized option '--shuffle"
      - write: 'printf "all: a .WAIT b\na b:\n\t@echo built\n" > Makefile'
        flags: ""
        sig: "No rule to make target '.WAIT'"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      mkdir -p /tmp/mk
      cd /tmp/mk
      {{write}}
      make {{flags}}
      echo ok
    signature: "{{sig}}"
    green:
      image: "gcc:15"
    red:
      image: "gcc:13"
    cause:
      dimension: build
      path: tool.make.version
      attribute: make version
      direction: lower
    bundle:
      - dimension: compiler
        path: env.GCC_VERSION
      - dimension: compiler
        path: tool.cc.version
      - dimension: os
        path: os.release.VERSION_ID
      - dimension: os
        path: os.release.PRETTY_NAME
      - dimension: os
        path: tool.libc.version
    visible: false
    note: The capsule has no make attribute; the gcc and distribution versions that come with it are visible.

  - id: build-checksum-pin
    title: A pinned checksum names a release other than the vendored artifact
    dimension: build
    instances: 2
    variants:
      - lib: widgetkit
        good: 68067a086d5b810661c4be520060255084938de1aad6a74649658dd3a1f50bed
        stale: adc1e3588849f0425ae1f8b229a1470ca736c1f2cf102cb52469413c868b4cd8
        body: "widgetkit 1.4.2\n"
      - lib: schemakit
        good: 3e34e52bb51b5b63087200744a69c631497c49ea948659c7225bcb8e5fef19ac
        stale: b99b9e5c335094126d2f7e852bbe685eb0802fa1bf798bc272ae0fdb46290749
        body: "schemakit 2.9.1\n"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      sha256sum -c /etc/app/pins.sha256
      echo ok
    signature: FAILED
    base:
      image: "debian:12-slim"
      files:
        "/opt/vendor/{{lib}}.txt": "{{body}}"
    green:
      files:
        /etc/app/pins.sha256: "{{good}}  /opt/vendor/{{lib}}.txt\n"
    red:
      files:
        /etc/app/pins.sha256: "{{stale}}  /opt/vendor/{{lib}}.txt\n"
    cause:
      dimension: build
      path: "deps.{{lib}}.checksum"
      attribute: pinned checksum of {{lib}}
      direction: changed
    visible: false

  - id: build-version-pin
    title: A build script pins a toolchain version other than the one installed
    dimension: build
    instances: 2
    variants:
      - tool: node
        probe: 'node --version | sed "s/^v//; s/\..*//"'
        image: "node:20-slim"
        good: "20"
        bad: "18"
      - tool: python
        probe: 'python3 --version | cut -d" " -f2 | cut -d. -f1,2'
        image: "python:3.12-slim"
        good: "3.12"
        bad: "3.9"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      want=$(cat /etc/app/pin)
      have=$({{probe}})
      if [ "$want" != "$have" ]; then
        echo "version pin mismatch: {{tool}} want $want, have $have"
        exit 1
      fi
      echo ok
    signature: "version pin mismatch"
    base:
      image: "{{image}}"
    green:
      files:
        /etc/app/pin: "{{good}}\n"
    red:
      files:
        /etc/app/pin: "{{bad}}\n"
    cause:
      dimension: build
      path: "project.pins.{{tool}}"
      attribute: pinned {{tool}} version
      direction: changed
    visible: false

  - id: build-javac-release
    title: A build passes javac a --release newer than the red JDK
    dimension: build
    instances: 2
    variants:
      - release: "21"
        red_image: "eclipse-temurin:17-jdk"
        green_image: "eclipse-temurin:21-jdk"
      - release: "17"
        red_image: "eclipse-temurin:11-jdk"
        green_image: "eclipse-temurin:17-jdk"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      cd /tmp
      printf 'class H { public static void main(String[] a) { System.out.println(1); } }\n' > H.java
      javac --release {{release}} H.java
      echo ok
    signature: "release version {{release}} not supported"
    green:
      image: "{{green_image}}"
    red:
      image: "{{red_image}}"
    cause:
      dimension: build
      path: tool.java.version
      attribute: java version
      direction: lower
    bundle:
      - dimension: runtime
        path: env.JAVA_VERSION

  - id: build-bundler-option
    title: A build step passes Bundler an option the red Bundler does not have
    dimension: build
    instances: 1
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      set -e
      mkdir -p /tmp/p
      cd /tmp/p
      printf 'source "https://rubygems.org"\n' > Gemfile
      bundle lock --local --add-checksums
      echo ok
    signature: "add-checksums"
    green:
      image: "ruby:3.4-slim"
    red:
      image: "ruby:3.3-slim"
    cause:
      dimension: build
      path: tool.ruby.version
      attribute: ruby version
      direction: lower
    bundle:
      - dimension: runtime
        path: env.RUBY_VERSION
      - dimension: runtime
        path: env.RUBY_DOWNLOAD_SHA256
