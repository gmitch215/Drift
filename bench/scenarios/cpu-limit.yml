schema: 1
templates:
  - id: cpu-limit-quota-basic
    title: A pool refuses to start under less than one CPU of quota
    dimension: cpu-limit
    instances: 2
    variants:
      - red_cpus: "0.5"
        gate: "1000"
        trials: "20"
      - red_cpus: "0.25"
        gate: "400"
        trials: "50"
    gate: "{{gate}}"
    trials: "{{trials}}"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      read quota period < /sys/fs/cgroup/cpu.max
      if [ "$quota" != max ] && [ "$quota" -lt "$period" ]; then
        echo "pool: cpu quota $quota/$period is below one full cpu, refusing to start"
        exit 1
      fi
      echo ok
    signature: "refusing to start"
    base:
      image: "debian:12-slim"
    green:
      cpus: "2"
    red:
      cpus: "{{red_cpus}}"
    cause:
      dimension: cpu-limit
      path: cgroup.cpu.max
      attribute: cpu quota
      direction: lower

  - id: cpu-limit-quota-decoy
    title: The quota check with a memory limit and a log level changed beside it
    dimension: cpu-limit
    instances: 2
    variants:
      - red_memory: 384m
        red_level: debug
      - red_memory: 256m
        red_level: trace
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      read quota period < /sys/fs/cgroup/cpu.max
      if [ "$quota" != max ] && [ "$quota" -lt "$period" ]; then
        echo "pool: cpu quota $quota/$period is below one full cpu, refusing to start"
        exit 1
      fi
      echo ok
    signature: "refusing to start"
    base:
      image: "debian:12-slim"
    green:
      cpus: "2"
      memory: 512m
      env:
        LOG_LEVEL: info
    red:
      cpus: "0.5"
      memory: "{{red_memory}}"
      env:
        LOG_LEVEL: "{{red_level}}"
    cause:
      dimension: cpu-limit
      path: cgroup.cpu.max
      attribute: cpu quota
      direction: lower
    decoys:
      - dimension: memory
        path: cgroup.memory.max
      - dimension: env
        path: env.LOG_LEVEL

  - id: cpu-limit-jvm-processors
    title: The JVM sizes its pool from the CPU quota and sees one processor under a fractional quota
    dimension: cpu-limit
    instances: 2
    variants:
      - red_cpus: "0.5"
      - red_cpus: "1"
      - red_cpus: "0.75"
    runtime: java
    program: |
      public class Prog {
          public static void main(String[] args) {
              if (!"1".equals(System.getenv("BENCH_FLAKE"))) {
                  System.out.println("ok");
                  return;
              }
              int n = Runtime.getRuntime().availableProcessors();
              if (n < 2) {
                  System.out.println("parallel sort pool needs 2 processors, JVM reports " + n);
                  System.exit(1);
              }
              System.out.println("ok " + n);
          }
      }
    signature: "JVM reports 1"
    base:
      image: "eclipse-temurin:17"
    green:
      cpus: "2"
    red:
      cpus: "{{red_cpus}}"
    cause:
      dimension: cpu-limit
      path: cgroup.cpu.max
      attribute: cpu quota
      direction: lower

  - id: cpu-limit-go-gomaxprocs
    title: Go sizes its scheduler from the CPU quota and a program that needs three procs gets fewer
    dimension: cpu-limit
    instances: 2
    variants:
      - green_cpus: "4"
        red_cpus: "1"
      - green_cpus: "3"
        red_cpus: "2"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      mkdir -p /tmp/gomax
      cat > /tmp/gomax/main.go <<'EOF'
      package main

      import (
          "fmt"
          "os"
          "runtime"
      )

      func main() {
          n := runtime.GOMAXPROCS(0)
          if n < 3 {
              fmt.Printf("scheduler: GOMAXPROCS is %d, the pipeline needs 3\n", n)
              os.Exit(1)
          }
          fmt.Println("ok", n)
      }
      EOF
      cd /tmp/gomax && go run main.go
    signature: "the pipeline needs 3"
    base:
      image: "golang:1.25"
    green:
      cpus: "{{green_cpus}}"
    red:
      cpus: "{{red_cpus}}"
    cause:
      dimension: cpu-limit
      path: cgroup.cpu.max
      attribute: cpu quota
      direction: lower

  - id: cpu-limit-quota-workers-decoy
    title: A worker count taken from the quota is zero, with a memory limit and a log level changed beside it
    dimension: cpu-limit
    instances: 2
    variants:
      - red_cpus: "0.5"
        red_memory: 384m
        red_level: debug
      - red_cpus: "0.25"
        red_memory: 256m
        red_level: trace
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      with open("/sys/fs/cgroup/cpu.max") as f:
          quota, period = f.read().split()
      workers = int(quota) // int(period) if quota != "max" else os.cpu_count()
      print("chunk", 100 // workers)
    signature: "ZeroDivisionError"
    base:
      image: "python:3.12-slim"
    green:
      cpus: "2"
      memory: 512m
      env:
        LOG_LEVEL: info
    red:
      cpus: "{{red_cpus}}"
      memory: "{{red_memory}}"
      env:
        LOG_LEVEL: "{{red_level}}"
    cause:
      dimension: cpu-limit
      path: cgroup.cpu.max
      attribute: cpu quota
      direction: lower
    decoys:
      - dimension: memory
        path: cgroup.memory.max
      - dimension: env
        path: env.LOG_LEVEL
