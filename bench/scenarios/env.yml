schema: 1
templates:
  - id: env-pool-size
    title: A setting is zero and a batch size divides by it
    dimension: env
    instances: 2
    variants:
      - name: DB_POOL_SIZE
        good: "8"
      - name: WORKER_COUNT
        good: "4"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      size = int(os.environ.get("{{name}}", "4"))
      print("per-worker batch", 128 // size)
    signature: ZeroDivisionError
    base:
      image: "python:3.12-slim"
    green:
      env:
        "{{name}}": "{{good}}"
    red:
      env:
        "{{name}}": "0"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: lower

  - id: env-pythonioencoding
    title: Output encoding is forced to a narrow charset and the program prints a wider character
    dimension: env
    instances: 2
    variants:
      - encoding: ascii
        text: "caf\\u00e9"
      - encoding: latin-1
        text: "\\u20ac5"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      print("{{text}}")
    signature: UnicodeEncodeError
    base:
      image: "python:3.12-slim"
    red:
      env:
        PYTHONIOENCODING: "{{encoding}}"
    cause:
      dimension: env
      path: env.PYTHONIOENCODING
      attribute: PYTHONIOENCODING
      direction: added

  - id: env-missing-var-plain
    title: A required variable is absent in the red environment
    dimension: env
    instances: 2
    variants:
      - name: API_BASE_URL
        value: "http://localhost:8080"
      - name: DATABASE_URL
        value: "postgres://localhost:5432/app"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      print(os.environ["{{name}}"])
    signature: "KeyError: '{{name}}'"
    base:
      image: "python:3.12-slim"
    green:
      env:
        "{{name}}": "{{value}}"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: removed

  - id: env-pool-size-decoy
    title: The zero pool size, with a locale and a timezone changed beside it
    dimension: env
    instances: 2
    variants:
      - red_lang: en_US.UTF-8
        red_tz: Asia/Tokyo
      - red_lang: POSIX
        red_tz: America/Chicago
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      size = int(os.environ.get("DB_POOL_SIZE", "4"))
      print("per-worker batch", 128 // size)
    signature: ZeroDivisionError
    base:
      image: "python:3.12-slim"
    green:
      env:
        DB_POOL_SIZE: "8"
        LANG: C.UTF-8
        TZ: UTC
    red:
      env:
        DB_POOL_SIZE: "0"
        LANG: "{{red_lang}}"
        TZ: "{{red_tz}}"
    cause:
      dimension: env
      path: env.DB_POOL_SIZE
      attribute: DB_POOL_SIZE
      direction: lower
    decoys:
      - dimension: locale
        path: env.LANG
      - dimension: locale
        path: env.TZ

  - id: env-retries-flaky-plain
    title: With no retries left, a flaky upstream call fails on part of the runs
    dimension: env
    instances: 2
    variants:
      - name: MAX_RETRIES
        gate: "300"
      - name: RETRY_LIMIT
        gate: "450"
    gate: "{{gate}}"
    trials: 50
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      if int(os.environ.get("{{name}}", "3")) == 0:
          raise ConnectionError("upstream reset the connection, retry budget exhausted")
      print("ok")
    signature: "retry budget exhausted"
    base:
      image: "python:3.12-slim"
    green:
      env:
        "{{name}}": "3"
    red:
      env:
        "{{name}}": "0"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: lower
