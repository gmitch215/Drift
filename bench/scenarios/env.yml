schema: 1
templates:
  - id: env-pool-size
    title: A setting is zero and a batch size divides by it
    dimension: env
    instances: 2
    variants:
      - name: DB_POOL_SIZE
        good: "8"
      - name: WORKER_COUNT
        good: "4"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      size = int(os.environ.get("{{name}}", "4"))
      print("per-worker batch", 128 // size)
    signature: ZeroDivisionError
    base:
      image: "python:3.12-slim"
    green:
      env:
        "{{name}}": "{{good}}"
    red:
      env:
        "{{name}}": "0"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: lower

  - id: env-pythonioencoding
    title: Output encoding is forced to a narrow charset and the program prints a wider character
    dimension: env
    instances: 2
    variants:
      - encoding: ascii
        text: "caf\\u00e9"
      - encoding: latin-1
        text: "\\u20ac5"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      print("{{text}}")
    signature: UnicodeEncodeError
    base:
      image: "python:3.12-slim"
    red:
      env:
        PYTHONIOENCODING: "{{encoding}}"
    cause:
      dimension: env
      path: env.PYTHONIOENCODING
      attribute: PYTHONIOENCODING
      direction: added

  - id: env-missing-var-plain
    title: A required variable is absent in the red environment
    dimension: env
    instances: 2
    variants:
      - name: API_BASE_URL
        value: "http://localhost:8080"
      - name: DATABASE_URL
        value: "postgres://localhost:5432/app"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      print(os.environ["{{name}}"])
    signature: "KeyError: '{{name}}'"
    base:
      image: "python:3.12-slim"
    green:
      env:
        "{{name}}": "{{value}}"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: removed

  - id: env-pool-size-decoy
    title: The zero pool size, with a locale and a timezone changed beside it
    dimension: env
    instances: 2
    variants:
      - red_lang: en_US.UTF-8
        red_tz: Asia/Tokyo
      - red_lang: POSIX
        red_tz: America/Chicago
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      size = int(os.environ.get("DB_POOL_SIZE", "4"))
      print("per-worker batch", 128 // size)
    signature: ZeroDivisionError
    base:
      image: "python:3.12-slim"
    green:
      env:
        DB_POOL_SIZE: "8"
        LANG: C.UTF-8
        TZ: UTC
    red:
      env:
        DB_POOL_SIZE: "0"
        LANG: "{{red_lang}}"
        TZ: "{{red_tz}}"
    cause:
      dimension: env
      path: env.DB_POOL_SIZE
      attribute: DB_POOL_SIZE
      direction: lower
    decoys:
      - dimension: locale
        path: env.LANG
      - dimension: locale
        path: env.TZ

  - id: env-retries-flaky-plain
    title: With no retries left, a flaky upstream call fails on part of the runs
    dimension: env
    instances: 2
    variants:
      - name: MAX_RETRIES
        gate: "300"
      - name: RETRY_LIMIT
        gate: "450"
    gate: "{{gate}}"
    trials: 50
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      if int(os.environ.get("{{name}}", "3")) == 0:
          raise ConnectionError("upstream reset the connection, retry budget exhausted")
      print("ok")
    signature: "retry budget exhausted"
    base:
      image: "python:3.12-slim"
    green:
      env:
        "{{name}}": "3"
    red:
      env:
        "{{name}}": "0"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: lower

  - id: env-pythonhashseed
    title: A test pins the iteration order of a string set and the hash seed is different
    dimension: env
    instances: 3
    variants:
      - seed: "1"
      - seed: "2"
      - seed: "3"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      words = {"alpha", "bravo", "charlie", "delta", "echo", "foxtrot"}
      expected = ["alpha", "delta", "echo", "charlie", "foxtrot", "bravo"]
      if list(words) != expected:
          print("snapshot mismatch: set order", list(words))
          sys.exit(1)
      print("ok")
    signature: "snapshot mismatch: set order"
    base:
      image: "python:3.12-slim"
    green:
      env:
        PYTHONHASHSEED: "0"
    red:
      env:
        PYTHONHASHSEED: "{{seed}}"
    cause:
      dimension: env
      path: env.PYTHONHASHSEED
      attribute: PYTHONHASHSEED
      direction: changed

  - id: env-pythonpath-shadow
    title: A directory on the module path holds a module named like a standard library module
    dimension: env
    instances: 3
    variants:
      - mod: json
        attr: dumps
      - mod: csv
        attr: writer
      - mod: textwrap
        attr: dedent
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      import {{mod}}

      print({{mod}}.{{attr}})
    signature: "has no attribute '{{attr}}'"
    base:
      image: "python:3.12-slim"
    red:
      env:
        PYTHONPATH: /shadow
      files:
        "/shadow/{{mod}}.py": "VERSION = 1\n"
    cause:
      dimension: env
      path: env.PYTHONPATH
      attribute: PYTHONPATH
      direction: added

  - id: env-force-color
    title: A variable turns on terminal colour and a captured log fills with escape codes
    dimension: env
    instances: 2
    variants:
      - name: FORCE_COLOR
      - name: PYTHON_COLORS
    runtime: python3
    program: |
      import os
      import subprocess
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      run = subprocess.run([sys.executable, "-c", "1/0"], capture_output=True, text=True)
      if "\x1b[" in run.stderr:
          print("captured traceback carries ANSI escape codes")
          sys.exit(1)
      print("ok")
    signature: "ANSI escape codes"
    base:
      image: "python:3.13-slim"
    red:
      env:
        "{{name}}": "1"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: added

  - id: env-node-max-old-space-decoy
    title: A V8 heap cap is added to NODE_OPTIONS, with NODE_ENV changed beside it
    dimension: env
    instances: 2
    variants:
      - cap: "48"
      - cap: "64"
    runtime: node
    program: |
      if (process.env.BENCH_FLAKE !== "1") {
        console.log("ok");
        process.exit(0);
      }
      const blocks = [];
      for (let i = 0; i < 12; i++) blocks.push(new Array(1000000).fill(i));
      console.log("ok", blocks.length);
    signature: "heap out of memory"
    base:
      image: "node:24-bookworm-slim"
    green:
      env:
        NODE_ENV: development
    red:
      env:
        NODE_ENV: production
        NODE_OPTIONS: "--max-old-space-size={{cap}}"
    cause:
      dimension: env
      path: env.NODE_OPTIONS
      attribute: NODE_OPTIONS
      direction: added
    decoys:
      - dimension: env
        path: env.NODE_ENV

  - id: env-jdk-java-options-flaky
    title: A JVM option variable changes the default language on part of the runs
    dimension: env
    instances: 3
    variants:
      - name: JDK_JAVA_OPTIONS
        lang: tr
        gate: "1000"
      - name: JAVA_TOOL_OPTIONS
        lang: de
        gate: "400"
      - name: JDK_JAVA_OPTIONS
        lang: fr
        gate: "1000"
    gate: "{{gate}}"
    trials: 40
    runtime: java
    program: |
      import java.util.Locale;

      public class Prog {
          public static void main(String[] args) {
              if (!"1".equals(System.getenv("BENCH_FLAKE"))) {
                  System.out.println("ok");
                  return;
              }
              String lang = Locale.getDefault().getLanguage();
              if (!lang.equals("en")) {
                  System.out.println("default language is " + lang + ", expected en");
                  System.exit(1);
              }
              System.out.println("ok");
          }
      }
    signature: ", expected en"
    base:
      image: "eclipse-temurin:17"
    red:
      env:
        "{{name}}": "-Duser.language={{lang}}"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: added

  - id: env-pip-cache-dir
    title: A cache location variable moves the package cache away from the home directory
    dimension: env
    instances: 3
    variants:
      - name: XDG_CACHE_HOME
        value: /tmp/xdg
        expected: /tmp/xdg/pip
      - name: PIP_CACHE_DIR
        value: /tmp/pipc
        expected: /tmp/pipc
      - name: XDG_CACHE_HOME
        value: /tmp/cache2
        expected: /tmp/cache2/pip
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      want=/tmp/.cache/pip
      got=$(python3 -m pip cache dir)
      if [ "$got" != "$want" ]; then
        echo "pip cache moved to $got, expected $want"
        exit 1
      fi
      echo ok
    signature: "pip cache moved to {{expected}}"
    base:
      image: "python:3.12-slim"
    red:
      env:
        "{{name}}": "{{value}}"
    cause:
      dimension: env
      path: "env.{{name}}"
      attribute: "{{name}}"
      direction: added

  - id: env-npm-config-variable
    title: An npm_config_ variable overrides a configuration default
    dimension: env
    instances: 3
    variants:
      - name: registry
        key: registry
        value: "http://localhost:4873/"
        want: "https://registry.npmjs.org/"
      - name: loglevel
        key: loglevel
        value: warn
        want: notice
      - name: ignore_scripts
        key: ignore-scripts
        value: "true"
        want: "false"
    runtime: sh
    program: |
      if [ "$BENCH_FLAKE" != 1 ]; then echo ok; exit 0; fi
      got=$(npm config get {{key}})
      if [ "$got" != '{{want}}' ]; then
        echo "npm {{key}} is $got, expected {{want}}"
        exit 1
      fi
      echo ok
    signature: "npm {{key}} is {{value}}, expected"
    base:
      image: "node:24-bookworm-slim"
    red:
      env:
        "npm_config_{{name}}": "{{value}}"
    cause:
      dimension: env
      path: "env.npm_config_{{name}}"
      attribute: "npm_config_{{name}}"
      direction: added
