schema: 1
templates:
  - id: limits-nofile
    title: A program opens more files than the red descriptor limit allows
    dimension: limits
    instances: 2
    variants:
      - open: "200"
        red_limit: "64:64"
      - open: "300"
        red_limit: "128:128"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      handles = [open("/dev/null") for _ in range({{open}})]
      print("opened", len(handles))
    signature: "Too many open files"
    base:
      image: "python:3.12-slim"
    green:
      ulimits:
        nofile: "1024:1024"
    red:
      ulimits:
        nofile: "{{red_limit}}"
    cause:
      dimension: limits
      path: limits.nofile
      attribute: open file descriptor limit
      direction: lower
    visible: false
    note: The capsule has no ulimit attribute yet.

  - id: limits-fsize
    title: A program writes a file larger than the red file size limit
    dimension: limits
    instances: 2
    variants:
      - bytes: "300000"
        red_limit: "100000:100000"
      - bytes: "600000"
        red_limit: "200000:200000"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      with open("/tmp/out.bin", "wb") as f:
          f.write(b"x" * {{bytes}})
      print("written")
    signature: "File too large"
    base:
      image: "python:3.12-slim"
    red:
      ulimits:
        fsize: "{{red_limit}}"
    cause:
      dimension: limits
      path: limits.fsize
      attribute: file size limit
      direction: lower
    visible: false

  - id: limits-nofile-decoy
    title: The descriptor limit, with a memory limit and a log level changed beside it
    dimension: limits
    instances: 2
    variants:
      - red_memory: 384m
        red_level: debug
      - red_memory: 256m
        red_level: trace
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      handles = [open("/dev/null") for _ in range(200)]
      print("opened", len(handles))
    signature: "Too many open files"
    base:
      image: "python:3.12-slim"
    green:
      memory: 512m
      env:
        LOG_LEVEL: info
      ulimits:
        nofile: "1024:1024"
    red:
      memory: "{{red_memory}}"
      env:
        LOG_LEVEL: "{{red_level}}"
      ulimits:
        nofile: "64:64"
    cause:
      dimension: limits
      path: limits.nofile
      attribute: open file descriptor limit
      direction: lower
    decoys:
      - dimension: memory
        path: cgroup.memory.max
      - dimension: env
        path: env.LOG_LEVEL
    visible: false

  - id: limits-data
    title: A program reserves more memory than the red data segment limit allows
    dimension: limits
    instances: 2
    variants:
      - mb: "300"
        red_limit: "200000000:200000000"
      - mb: "400"
        red_limit: "300000000:300000000"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      data = bytearray({{mb}} * 1024 * 1024)
      print("allocated", len(data))
    signature: "MemoryError"
    base:
      image: "python:3.12-slim"
    green:
      ulimits:
        data: "-1:-1"
    red:
      ulimits:
        data: "{{red_limit}}"
    cause:
      dimension: limits
      path: limits.data
      attribute: data segment limit
      direction: lower
    visible: false
    note: The capsule has no ulimit attribute yet.

  - id: limits-core
    title: A crash handler refuses to start when the red core file size limit is zero
    dimension: limits
    instances: 2
    variants:
      - red_limit: "0:0"
      - red_limit: "0:-1"
    runtime: python3
    program: |
      import os
      import resource
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      soft, hard = resource.getrlimit(resource.RLIMIT_CORE)
      if soft == 0:
          print("crash handler: core dumps are disabled (RLIMIT_CORE is 0)")
          sys.exit(1)
      print("ok")
    signature: "core dumps are disabled"
    base:
      image: "python:3.12-slim"
    green:
      ulimits:
        core: "-1:-1"
    red:
      ulimits:
        core: "{{red_limit}}"
    cause:
      dimension: limits
      path: limits.core
      attribute: core file size limit
      direction: lower
    visible: false
    note: The capsule has no ulimit attribute yet.

  - id: limits-cpu-time
    title: A job runs longer than the red CPU time limit and gets the signal for it
    dimension: limits
    instances: 2
    variants:
      - red_limit: "1:3"
        gate: "1000"
      - red_limit: "1:2"
        gate: "500"
    gate: "{{gate}}"
    trials: 20
    runtime: python3
    program: |
      import os
      import signal
      import sys
      import time


      def stop(signum, frame):
          print("cpu time limit exceeded")
          sys.exit(1)


      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      signal.signal(signal.SIGXCPU, stop)
      end = time.process_time() + 2
      while time.process_time() < end:
          pass
      print("done")
    signature: "cpu time limit exceeded"
    base:
      image: "python:3.12-slim"
    green:
      ulimits:
        cpu: "-1:-1"
    red:
      ulimits:
        cpu: "{{red_limit}}"
    cause:
      dimension: limits
      path: limits.cpu
      attribute: CPU time limit
      direction: lower
    visible: false
    note: The capsule has no ulimit attribute yet.

  - id: limits-nofile-pipe
    title: A program opens pipes until the red descriptor limit refuses the next one
    dimension: limits
    instances: 2
    variants:
      - pipes: "40"
        red_limit: "64:64"
      - pipes: "60"
        red_limit: "96:96"
    runtime: python3
    program: |
      import os
      import sys

      if os.environ.get("BENCH_FLAKE") != "1":
          print("ok")
          sys.exit(0)
      pairs = [os.pipe() for _ in range({{pipes}})]
      print("opened", len(pairs))
    signature: "Too many open files"
    base:
      image: "python:3.12-slim"
    green:
      ulimits:
        nofile: "1024:1024"
    red:
      ulimits:
        nofile: "{{red_limit}}"
    cause:
      dimension: limits
      path: limits.nofile
      attribute: open file descriptor limit
      direction: lower
    visible: false
    note: The capsule has no ulimit attribute yet.
