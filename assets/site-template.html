<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title><!-- title --></title>
		<meta name="description" content="<!-- description -->" />
		<link rel="icon" href="drift.ico" sizes="any" />
		<link rel="icon" href="drift_128.png" type="image/png" sizes="128x128" />
		<link rel="apple-touch-icon" href="drift.png" />
		<meta property="og:title" content="<!-- title -->" />
		<meta property="og:description" content="<!-- description -->" />
		<meta property="og:image" content="https://drift.gmitch215.dev/drift.png" />
		<style>
			:root {
				color-scheme: light dark;
				--fg: #1d1a26;
				--muted: #5b556b;
				--bg: #fcfbfe;
				--card: #ffffff;
				--line: #e4def0;
				--accent: #6b3fd4;
				--accent-strong: #8a63f0;
				--pink: #b0399a;
				--pink-soft: #c768bd;
				--coral: #e4707a;
				--code-bg: #f4f0fb;
				--code-fg: #96307f;
				--tint: #efe8fb;
				--gradient: linear-gradient(90deg, #7a4fe0 0%, #a548c6 60%, #bd3a93 100%);
				--glow: color-mix(in oklab, #8a63f0 16%, transparent);
				--glow-pink: color-mix(in oklab, #c768bd 11%, transparent);
				--glow-coral: color-mix(in oklab, #e4707a 7%, transparent);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--fg: #ece9f3;
					--muted: #a69fb8;
					--bg: #110e17;
					--card: #191521;
					--line: #2b2438;
					--accent: #b99cff;
					--accent-strong: #9d7bf5;
					--pink: #e58fd8;
					--pink-soft: #c872bd;
					--coral: #f08a92;
					--code-bg: #1f1a2a;
					--code-fg: #f0a6e4;
					--tint: #2a2140;
					--gradient: linear-gradient(90deg, #b99cff 0%, #d595ee 60%, #f09ad0 100%);
					--glow: color-mix(in oklab, #9d7bf5 22%, transparent);
					--glow-pink: color-mix(in oklab, #c872bd 14%, transparent);
					--glow-coral: color-mix(in oklab, #f08a92 7%, transparent);
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 0 1rem 5rem;
				background:
					radial-gradient(60rem 30rem at 30% -10rem, var(--glow), transparent 70%),
					radial-gradient(40rem 24rem at 95% 0, var(--glow-pink), transparent 70%),
					radial-gradient(30rem 16rem at 100% 8rem, var(--glow-coral), transparent 70%),
					var(--bg);
				color: var(--fg);
				font:
					16px/1.7 ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				overflow-wrap: break-word;
			}
			main,
			nav .bar,
			footer {
				max-width: 52rem;
				margin: 0 auto;
			}
			nav {
				margin: 0 -1rem 2.5rem;
				padding: 0.75rem 1rem;
				border-bottom: 1px solid var(--line);
			}
			nav .bar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.25rem 1rem;
			}
			nav a {
				color: var(--muted);
				font-size: 0.925rem;
				text-decoration: none;
			}
			nav a:hover,
			nav a[aria-current] {
				color: var(--accent);
			}
			nav a[aria-current] {
				text-decoration: underline;
				text-decoration-color: var(--pink-soft);
				text-decoration-thickness: 2px;
				text-underline-offset: 0.5em;
			}
			nav a.brand {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				margin-right: auto;
				color: var(--fg);
				font-size: 1.05rem;
				font-weight: 700;
				letter-spacing: -0.01em;
			}
			nav a.brand[aria-current] {
				color: var(--fg);
				text-decoration: none;
			}
			nav a.brand img {
				width: 1.75rem;
				height: 1.75rem;
			}
			h1 {
				margin: 0 0 1rem;
				font-size: 2.25rem;
				line-height: 1.2;
				letter-spacing: -0.03em;
			}
			.hero {
				margin: 0 0 2rem;
			}
			.hero img {
				display: block;
				margin: 0 0 1rem;
			}
			.hero h1 {
				width: fit-content;
				margin: 0 0 0.25rem;
				color: var(--accent);
				font-size: 3rem;
			}
			@supports (background-clip: text) or (-webkit-background-clip: text) {
				.hero h1 {
					background: var(--gradient);
					-webkit-background-clip: text;
					background-clip: text;
					-webkit-text-fill-color: transparent;
					color: transparent;
				}
			}
			.hero .lead {
				margin: 0;
				color: var(--muted);
				font-size: 1.2rem;
			}
			.links {
				display: grid;
				gap: 0.85rem;
				grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
				margin: 0 0 3rem;
			}
			a.card {
				display: block;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				background: var(--card);
				color: inherit;
				text-decoration: none;
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			a.card:hover {
				border-color: var(--accent-strong);
				box-shadow: 0 0 36px -10px var(--accent-strong);
			}
			a.card strong {
				color: var(--accent);
			}
			a.card strong {
				display: block;
				font-size: 1.02rem;
			}
			a.card span {
				color: var(--muted);
				font-size: 0.875rem;
				line-height: 1.5;
			}

			.readme h2 {
				margin: 3rem 0 1rem;
				padding-bottom: 0.4rem;
				border-bottom: 2px solid transparent;
				border-image: linear-gradient(90deg, var(--accent-strong), var(--pink-soft) 40%, var(--line)) 1;
				font-size: 1.55rem;
				letter-spacing: -0.01em;
			}
			.readme h3 {
				margin: 2rem 0 0.75rem;
				padding-left: 0.6rem;
				border-left: 3px solid var(--pink-soft);
				font-size: 1.2rem;
			}
			.readme h4 {
				margin: 1.5rem 0 0.5rem;
			}
			.readme a {
				color: var(--accent);
				text-underline-offset: 0.2em;
			}
			.readme hr {
				margin: 3rem 0;
				border: 0;
				border-top: 1px solid var(--line);
			}
			.readme blockquote {
				margin: 1.5rem 0;
				padding: 0.25rem 0 0.25rem 1.25rem;
				border-left: 3px solid var(--pink-soft);
				color: var(--muted);
			}
			.readme ul,
			.readme ol {
				padding-left: 1.4rem;
			}
			.readme li {
				margin: 0.35rem 0;
			}
			.readme li::marker {
				color: var(--pink-soft);
			}
			.readme code {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			}
			.readme :not(pre) > code {
				padding: 0.15em 0.4em;
				border-radius: 0.35rem;
				background: var(--code-bg);
				color: var(--code-fg);
				font-size: 0.85em;
				overflow-wrap: anywhere;
			}
			.readme pre {
				margin: 1.25rem 0;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				overflow-x: auto;
				background: var(--code-bg);
				font-size: 0.85rem;
				line-height: 1.6;
			}
			.readme pre code {
				display: block;
			}
			.readme .table {
				overflow-x: auto;
				margin: 1.25rem 0;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
			}
			.readme table {
				width: 100%;
				border-collapse: collapse;
				font-size: 0.925rem;
			}
			.readme th,
			.readme td {
				padding: 0.55rem 0.9rem;
				border-bottom: 1px solid var(--line);
				text-align: left;
				vertical-align: top;
			}
			.readme th {
				background: var(--tint);
				border-bottom-color: var(--accent-strong);
				font-weight: 600;
			}
			.readme tbody tr:last-child td {
				border-bottom: 0;
			}
			.readme img {
				max-width: 100%;
			}

			footer {
				margin-top: 4rem;
				padding-top: 1.5rem;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 0.9rem;
			}
			footer a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="bar"><!-- nav --></div>
		</nav>
		<main>
			<!-- hero -->
			<div class="readme"><!-- readme --></div>
		</main>
		<footer>
			<a href="https://github.com/gmitch215/Drift">github.com/gmitch215/Drift</a> &middot;
			<a href="https://github.com/gmitch215/Drift/blob/master/LICENSE">MIT License</a>
		</footer>
	</body>
</html>
