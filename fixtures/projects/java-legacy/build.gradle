plugins {
    id 'java'
}

dependencies {
    implementation 'org.springframework:spring-core:5.3.39'
}

task header(type: Exec) {
    commandLine 'javah', '-d', 'build/headers', 'app.Native'
}

task runTool(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'app.Main'
}
