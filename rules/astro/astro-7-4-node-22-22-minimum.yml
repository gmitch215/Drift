schema: 1
id: astro-7-4-node-22-22-minimum
title: Astro 7.4 declares engines.node >=22.22.0, so a Node version outside that range is unsupported
applies:
  - runtime
  - build
difference: >-
  side a is a Node version inside the engines range of Astro 7.4 and side b is a Node version outside it, with the same Astro 7.4 release on side b
symptoms:
  - text: 'npm reports EBADENGINE for astro on the unsupported Node version, and the package may fail to start'
    basis: inferred
mechanism: >-
  The registry document of astro 7.4.0 declares engines.node >=22.22.0, so a Node version outside that range is unsupported by Astro 7.4.
detect:
  all:
    - a: tool.node.version
      ver: '>=22.22.0'
    - b: tool.node.version
      ver: '<22.22.0'
    - b: project.npm.astro
      ver: '>=7.4.0'
severity: medium
provenance:
  - url: https://registry.npmjs.org/astro/7.4.0
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'engines of astro 7.4.0: "engines":{"node":">=22.22.0"}'
fixtures:
  positive:
    - name: 'Astro 7.4 on node 24.11.0 to node 22.12.0'
      a:
        attrs:
          tool.node.version: '24.11.0'
      b:
        attrs:
          tool.node.version: '22.12.0'
          project.npm.astro: '7.4.0'
  negative:
    - name: 'astro 7.3.8 is below the first release with this range'
      a:
        attrs:
          tool.node.version: '24.11.0'
      b:
        attrs:
          tool.node.version: '22.12.0'
          project.npm.astro: '7.3.8'
    - name: 'node 24.11.0 is inside the range on both sides'
      a:
        attrs:
          tool.node.version: '24.11.0'
      b:
        attrs:
          tool.node.version: '24.11.0'
          project.npm.astro: '7.4.0'
status: active
