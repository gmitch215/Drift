schema: 1
id: astro-6-0-6-node-22-12-minimum
title: Astro 6.0.6 declares engines.node >=22.12.0, so a Node version outside that range is unsupported
applies:
  - runtime
  - build
difference: >-
  side a is a Node version inside the engines range of Astro 6.0.6 and side b is a Node version outside it, with the same Astro 6.0.6 release on side b
symptoms:
  - text: 'npm reports EBADENGINE for astro on the unsupported Node version, and the package may fail to start'
    basis: inferred
mechanism: >-
  The registry document of astro 6.0.6 declares engines.node >=22.12.0, so a Node version outside that range is unsupported by Astro 6.0.6.
detect:
  all:
    - a: tool.node.version
      ver: '>=22.12.0'
    - b: tool.node.version
      ver: '<22.12.0'
    - b: project.npm.astro
      ver: '>=6.0.6'
severity: medium
provenance:
  - url: https://registry.npmjs.org/astro/6.0.6
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'engines of astro 6.0.6: "engines":{"node":">=22.12.0"}'
fixtures:
  positive:
    - name: 'Astro 6.0.6 on node 24.11.0 to node 20.19.1'
      a:
        attrs:
          tool.node.version: '24.11.0'
      b:
        attrs:
          tool.node.version: '20.19.1'
          project.npm.astro: '6.0.6'
  negative:
    - name: 'astro 6.0.5 is below the first release with this range'
      a:
        attrs:
          tool.node.version: '24.11.0'
      b:
        attrs:
          tool.node.version: '20.19.1'
          project.npm.astro: '6.0.5'
    - name: 'node 24.11.0 is inside the range on both sides'
      a:
        attrs:
          tool.node.version: '24.11.0'
      b:
        attrs:
          tool.node.version: '24.11.0'
          project.npm.astro: '6.0.6'
status: active
