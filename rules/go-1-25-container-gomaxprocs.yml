schema: 1
id: go-1-25-container-gomaxprocs
title: Go before 1.25 ignores the cgroup CPU limit
applies:
  - runtime
  - cpu-limit
difference: >-
  the Go toolchain is older than 1.25 on the failing side, newer on the passing side, and the
  failing side has a cgroup CPU limit below the logical CPU count
symptoms:
  - text: >-
      a Go service runs more threads than its CPU quota and gets throttled, so latency spikes or
      timeouts appear under load
    basis: inferred
mechanism: >-
  Before Go 1.25 GOMAXPROCS defaults to runtime.NumCPU and ignores the cgroup CPU bandwidth limit,
  which Go 1.25 now reads.
probe: resources.cgroup-cpu
detect:
  all:
    - a: tool.go.version
      ver: '>=1.25'
    - b: tool.go.version
      ver: '<1.25'
    - b: probe:resources.cgroup-cpu
      has: limited cpus=
severity: medium
provenance:
  - url: https://go.dev/doc/go1.25
    kind: release-note
    verified: '2026-10-06'
    section: 'Runtime: Container-aware GOMAXPROCS'
fixtures:
  positive:
    - name: 'go 1.25 passes, go 1.24.13 limited to 2 cpus'
      a:
        attrs:
          tool.go.version: '1.25.0'
        probes:
          resources.cgroup-cpu: "cpu-max = limited cpus=2.0\n"
      b:
        attrs:
          tool.go.version: '1.24.13'
        probes:
          resources.cgroup-cpu: "cpu-max = limited cpus=2.0\n"
  negative:
    - name: go 1.24.13 but no cpu limit
      a:
        attrs:
          tool.go.version: '1.25.0'
        probes:
          resources.cgroup-cpu: "cpu-max = unlimited\n"
      b:
        attrs:
          tool.go.version: '1.24.13'
        probes:
          resources.cgroup-cpu: "cpu-max = unlimited\n"
    - name: both sides on 1.25
      a:
        attrs:
          tool.go.version: '1.25.0'
        probes:
          resources.cgroup-cpu: "cpu-max = limited cpus=2.0\n"
      b:
        attrs:
          tool.go.version: '1.25.1'
        probes:
          resources.cgroup-cpu: "cpu-max = limited cpus=2.0\n"
status: active
