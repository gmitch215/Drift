schema: 1
id: kgp-2-1-21-agp-outside-compatibility-table
title: Kotlin Multiplatform plugin 2.1.21 lists Android Gradle plugin 7.3.1 through 8.7.2; a version outside it is untested
applies:
  - build
difference: >-
  side a is Android Gradle plugin inside 7.3.1 through 8.7.2 or a Kotlin outside 2.1.21; side b is Kotlin 2.1.21 with Android Gradle plugin outside 7.3.1 through 8.7.2
symptoms:
  - text: >-
      none is quoted; the compatibility guide lists Android Gradle plugin 7.3.1 through 8.7.2 for this plugin version and says nothing about versions outside it
    basis: range
mechanism: >-
  The Kotlin Multiplatform compatibility guide lists Android Gradle plugin 7.3.1 through 8.7.2 for Kotlin 2.1.21.
detect:
  all:
    - b: project.gradle.kotlin.version
      present: 'true'
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.kotlin.version
      ver: '>=2.1.21,<=2.1.21'
    - b: project.gradle.agp.version
      ver:
          - '<7.3.1'
          - '>8.7.2'
    - not:
        all:
          - a: project.gradle.kotlin.version
            ver: '>=2.1.21,<=2.1.21'
          - a: project.gradle.agp.version
            ver:
                - '<7.3.1'
                - '>8.7.2'
severity: medium
provenance:
  - url: https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'Version compatibility; row "2.1.21", cells "7.6.3-8.12.1" and "7.3.1-8.7.2"'
fixtures:
  positive:
    - name: android gradle plugin 8.7.2 to 7.3.0 with kotlin 2.1.21
      a:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '7.3.1'
      b:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '7.3.0'
    - name: android gradle plugin 8.7.2 to 8.7.2.1 with kotlin 2.1.21
      a:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '8.7.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '8.7.2.1'
  negative:
    - name: android gradle plugin 7.3.1 to 8.7.2 is inside the table
      a:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '7.3.1'
      b:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '8.7.2'
    - name: android gradle plugin 7.3.0 with kotlin 2.1.21 on both sides is not new
      a:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '7.3.0'
      b:
        attrs:
          project.gradle.kotlin.version: '2.1.21'
          project.gradle.agp.version: '7.3.0'
    - name: android gradle plugin 7.3.0 with kotlin 1.0.0 is outside this row
      a:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '7.3.1'
      b:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '7.3.0'
    - name: android gradle plugin 7.3.0 without a kotlin version
      a:
        attrs:
          project.gradle.agp.version: '7.3.1'
      b:
        attrs:
          project.gradle.agp.version: '7.3.0'
status: active
