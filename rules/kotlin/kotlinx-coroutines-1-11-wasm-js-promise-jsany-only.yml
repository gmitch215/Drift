      a:
        attrs:
          project.gradle.org.jetbrains.kotlinx:kotlinx-coroutines-core: '1.10.2'
          project.gradle.kotlin.target.jvm: 'true'
      b:
        attrs:
          project.gradle.org.jetbrains.kotlinx:kotlinx-coroutines-core: '1.11.0'
