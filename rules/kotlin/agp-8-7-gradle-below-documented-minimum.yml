schema: 1
id: agp-8-7-gradle-below-documented-minimum
title: AGP 8.7 lists Gradle 8.9 as its minimum version
applies:
  - build
difference: >-
  side a is AGP 8.7 with Gradle 8.9 or later; side b is the same AGP with Gradle below 8.9
symptoms:
  - text: >-
      none is quoted; the release notes list the minimum Gradle version and name no failure
    basis: range
mechanism: >-
  The Android Gradle plugin 8.7 release notes list Gradle 8.9 as the minimum version.
detect:
  all:
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.wrapper
      present: 'true'
    - b: project.gradle.agp.version
      ver: '>=8.7.0,<8.8.0'
    - b: project.gradle.wrapper
      ver: '<8.9'
    - not:
        all:
          - a: project.gradle.agp.version
            ver: '>=8.7.0,<8.8.0'
          - a: project.gradle.wrapper
            ver: '<8.9'
severity: medium
provenance:
  - url: https://developer.android.com/build/releases/past-releases/agp-8-7-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; Gradle row, minimum version "8.9"'
fixtures:
  positive:
    - name: agp 8.7.0 with gradle 8.9 to gradle 8.8
      a:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.9'
      b:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.8'
  negative:
    - name: agp 8.7.0 with gradle 8.9 meets the minimum
      a:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.9'
      b:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.9.1'
    - name: agp 8.7.0 with gradle 8.8 on both sides is not new
      a:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.8'
      b:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.8'
    - name: agp 8.12.0 with gradle 8.8 is another line
      a:
        attrs:
          project.gradle.agp.version: '8.12.0'
          project.gradle.wrapper: '8.9'
      b:
        attrs:
          project.gradle.agp.version: '8.12.0'
          project.gradle.wrapper: '8.8'
    - name: gradle 8.8 without an agp version
      a:
        attrs:
          project.gradle.wrapper: '8.9'
      b:
        attrs:
          project.gradle.wrapper: '8.8'
status: active
