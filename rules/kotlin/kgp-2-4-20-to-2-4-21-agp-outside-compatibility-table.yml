schema: 1
id: kgp-2-4-20-to-2-4-21-agp-outside-compatibility-table
title: Kotlin Multiplatform plugin 2.4.20 to 2.4.21 lists Android Gradle plugin 8.5.2 through 9.3.1; a version outside it is untested
applies:
  - build
difference: >-
  side a is Android Gradle plugin inside 8.5.2 through 9.3.1 or a Kotlin outside 2.4.20 to 2.4.21; side b is Kotlin 2.4.20 to 2.4.21 with Android Gradle plugin outside 8.5.2 through 9.3.1
symptoms:
  - text: >-
      none is quoted; the compatibility guide lists Android Gradle plugin 8.5.2 through 9.3.1 for this plugin version and says nothing about versions outside it
    basis: range
mechanism: >-
  The Kotlin Multiplatform compatibility guide lists Android Gradle plugin 8.5.2 through 9.3.1 for Kotlin 2.4.20 to 2.4.21.
detect:
  all:
    - b: project.gradle.kotlin.version
      present: 'true'
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.kotlin.version
      ver: '>=2.4.20,<=2.4.21'
    - b: project.gradle.agp.version
      ver:
          - '<8.5.2'
          - '>9.3.1'
    - not:
        all:
          - a: project.gradle.kotlin.version
            ver: '>=2.4.20,<=2.4.21'
          - a: project.gradle.agp.version
            ver:
                - '<8.5.2'
                - '>9.3.1'
severity: medium
provenance:
  - url: https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'Version compatibility; row "2.4.20-2.4.21", cells "7.6.3-9.7.0" and "8.5.2-9.3.1"'
fixtures:
  positive:
    - name: android gradle plugin 9.3.1 to 8.5.1 with kotlin 2.4.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.agp.version: '8.5.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.agp.version: '8.5.1'
    - name: android gradle plugin 9.3.1 to 9.3.1.1 with kotlin 2.4.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.agp.version: '9.3.1'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.agp.version: '9.3.1.1'
  negative:
    - name: android gradle plugin 8.5.2 to 9.3.1 is inside the table
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.agp.version: '8.5.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.agp.version: '9.3.1'
    - name: android gradle plugin 8.5.1 with kotlin 2.4.21 on both sides is not new
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.21'
          project.gradle.agp.version: '8.5.1'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.21'
          project.gradle.agp.version: '8.5.1'
    - name: android gradle plugin 8.5.1 with kotlin 1.0.0 is outside this row
      a:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '8.5.2'
      b:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '8.5.1'
    - name: android gradle plugin 8.5.1 without a kotlin version
      a:
        attrs:
          project.gradle.agp.version: '8.5.2'
      b:
        attrs:
          project.gradle.agp.version: '8.5.1'
status: active
