schema: 1
id: agp-8-9-gradle-below-documented-minimum
title: AGP 8.9 lists Gradle 8.11.1 as its minimum version
applies:
  - build
difference: >-
  side a is AGP 8.9 with Gradle 8.11.1 or later; side b is the same AGP with Gradle below 8.11.1
symptoms:
  - text: >-
      none is quoted; the release notes list the minimum Gradle version and name no failure
    basis: range
mechanism: >-
  The Android Gradle plugin 8.9 release notes list Gradle 8.11.1 as the minimum version.
detect:
  all:
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.wrapper
      present: 'true'
    - b: project.gradle.agp.version
      ver: '>=8.9.0,<8.10.0'
    - b: project.gradle.wrapper
      ver: '<8.11.1'
    - not:
        all:
          - a: project.gradle.agp.version
            ver: '>=8.9.0,<8.10.0'
          - a: project.gradle.wrapper
            ver: '<8.11.1'
severity: medium
provenance:
  - url: https://developer.android.com/build/releases/past-releases/agp-8-9-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; Gradle row, minimum version "8.11.1"'
fixtures:
  positive:
    - name: agp 8.9.0 with gradle 8.11.1 to gradle 8.11.0
      a:
        attrs:
          project.gradle.agp.version: '8.9.0'
          project.gradle.wrapper: '8.11.1'
      b:
        attrs:
          project.gradle.agp.version: '8.9.0'
          project.gradle.wrapper: '8.11.0'
  negative:
    - name: agp 8.9.0 with gradle 8.11.1 meets the minimum
      a:
        attrs:
          project.gradle.agp.version: '8.9.0'
          project.gradle.wrapper: '8.11.1'
      b:
        attrs:
          project.gradle.agp.version: '8.9.0'
          project.gradle.wrapper: '8.11.1.1'
    - name: agp 8.9.0 with gradle 8.11.0 on both sides is not new
      a:
        attrs:
          project.gradle.agp.version: '8.9.0'
          project.gradle.wrapper: '8.11.0'
      b:
        attrs:
          project.gradle.agp.version: '8.9.0'
          project.gradle.wrapper: '8.11.0'
    - name: agp 8.14.0 with gradle 8.11.0 is another line
      a:
        attrs:
          project.gradle.agp.version: '8.14.0'
          project.gradle.wrapper: '8.11.1'
      b:
        attrs:
          project.gradle.agp.version: '8.14.0'
          project.gradle.wrapper: '8.11.0'
    - name: gradle 8.11.0 without an agp version
      a:
        attrs:
          project.gradle.wrapper: '8.11.1'
      b:
        attrs:
          project.gradle.wrapper: '8.11.0'
status: active
