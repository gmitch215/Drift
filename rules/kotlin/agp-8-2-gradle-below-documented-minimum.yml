schema: 1
id: agp-8-2-gradle-below-documented-minimum
title: AGP 8.2 lists Gradle 8.2 as its minimum version
applies:
  - build
difference: >-
  side a is AGP 8.2 with Gradle 8.2 or later; side b is the same AGP with Gradle below 8.2
symptoms:
  - text: >-
      none is quoted; the release notes list the minimum Gradle version and name no failure
    basis: range
mechanism: >-
  The Android Gradle plugin 8.2 release notes list Gradle 8.2 as the minimum version.
detect:
  all:
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.wrapper
      present: 'true'
    - b: project.gradle.agp.version
      ver: '>=8.2.0,<8.3.0'
    - b: project.gradle.wrapper
      ver: '<8.2'
    - not:
        all:
          - a: project.gradle.agp.version
            ver: '>=8.2.0,<8.3.0'
          - a: project.gradle.wrapper
            ver: '<8.2'
severity: medium
provenance:
  - url: https://developer.android.com/build/releases/past-releases/agp-8-2-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; Gradle row, minimum version "8.2"'
fixtures:
  positive:
    - name: agp 8.2.0 with gradle 8.2 to gradle 8.1
      a:
        attrs:
          project.gradle.agp.version: '8.2.0'
          project.gradle.wrapper: '8.2'
      b:
        attrs:
          project.gradle.agp.version: '8.2.0'
          project.gradle.wrapper: '8.1'
  negative:
    - name: agp 8.2.0 with gradle 8.2 meets the minimum
      a:
        attrs:
          project.gradle.agp.version: '8.2.0'
          project.gradle.wrapper: '8.2'
      b:
        attrs:
          project.gradle.agp.version: '8.2.0'
          project.gradle.wrapper: '8.2.1'
    - name: agp 8.2.0 with gradle 8.1 on both sides is not new
      a:
        attrs:
          project.gradle.agp.version: '8.2.0'
          project.gradle.wrapper: '8.1'
      b:
        attrs:
          project.gradle.agp.version: '8.2.0'
          project.gradle.wrapper: '8.1'
    - name: agp 8.7.0 with gradle 8.1 is another line
      a:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.2'
      b:
        attrs:
          project.gradle.agp.version: '8.7.0'
          project.gradle.wrapper: '8.1'
    - name: gradle 8.1 without an agp version
      a:
        attrs:
          project.gradle.wrapper: '8.2'
      b:
        attrs:
          project.gradle.wrapper: '8.1'
status: active
