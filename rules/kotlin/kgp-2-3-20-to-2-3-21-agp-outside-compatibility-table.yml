schema: 1
id: kgp-2-3-20-to-2-3-21-agp-outside-compatibility-table
title: Kotlin Multiplatform plugin 2.3.20 to 2.3.21 lists Android Gradle plugin 8.2.2 through 9.0.0; a version outside it is untested
applies:
  - build
difference: >-
  side a is Android Gradle plugin inside 8.2.2 through 9.0.0 or a Kotlin outside 2.3.20 to 2.3.21; side b is Kotlin 2.3.20 to 2.3.21 with Android Gradle plugin outside 8.2.2 through 9.0.0
symptoms:
  - text: >-
      none is quoted; the compatibility guide lists Android Gradle plugin 8.2.2 through 9.0.0 for this plugin version and says nothing about versions outside it
    basis: range
mechanism: >-
  The Kotlin Multiplatform compatibility guide lists Android Gradle plugin 8.2.2 through 9.0.0 for Kotlin 2.3.20 to 2.3.21.
detect:
  all:
    - b: project.gradle.kotlin.version
      present: 'true'
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.kotlin.version
      ver: '>=2.3.20,<=2.3.21'
    - b: project.gradle.agp.version
      ver:
          - '<8.2.2'
          - '>9.0.0'
    - not:
        all:
          - a: project.gradle.kotlin.version
            ver: '>=2.3.20,<=2.3.21'
          - a: project.gradle.agp.version
            ver:
                - '<8.2.2'
                - '>9.0.0'
severity: medium
provenance:
  - url: https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'Version compatibility; row "2.3.20-2.3.21", cells "7.6.3-9.3.0" and "8.2.2-9.0.0"'
fixtures:
  positive:
    - name: android gradle plugin 9.0.0 to 8.2.1 with kotlin 2.3.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.3.20'
          project.gradle.agp.version: '8.2.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.3.20'
          project.gradle.agp.version: '8.2.1'
    - name: android gradle plugin 9.0.0 to 9.0.0.1 with kotlin 2.3.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.3.20'
          project.gradle.agp.version: '9.0.0'
      b:
        attrs:
          project.gradle.kotlin.version: '2.3.20'
          project.gradle.agp.version: '9.0.0.1'
  negative:
    - name: android gradle plugin 8.2.2 to 9.0.0 is inside the table
      a:
        attrs:
          project.gradle.kotlin.version: '2.3.20'
          project.gradle.agp.version: '8.2.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.3.20'
          project.gradle.agp.version: '9.0.0'
    - name: android gradle plugin 8.2.1 with kotlin 2.3.21 on both sides is not new
      a:
        attrs:
          project.gradle.kotlin.version: '2.3.21'
          project.gradle.agp.version: '8.2.1'
      b:
        attrs:
          project.gradle.kotlin.version: '2.3.21'
          project.gradle.agp.version: '8.2.1'
    - name: android gradle plugin 8.2.1 with kotlin 1.0.0 is outside this row
      a:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '8.2.2'
      b:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '8.2.1'
    - name: android gradle plugin 8.2.1 without a kotlin version
      a:
        attrs:
          project.gradle.agp.version: '8.2.2'
      b:
        attrs:
          project.gradle.agp.version: '8.2.1'
status: active
