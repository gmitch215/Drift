schema: 1
id: agp-9-1-to-9-4-compile-sdk-above-37
title: AGP 9.1 to 9.4 lists API level 37 as its maximum, so a higher compileSdk is untested
applies:
  - build
difference: >-
  side a is a project on an AGP outside 9.1 to 9.4; side b is the same project on that AGP with compileSdk above 37
symptoms:
  - text: >-
      none is quoted for these releases; the release notes name the maximum API level and no failure above it
    basis: range
mechanism: >-
  The Android Gradle plugin 9.1 to 9.4 release notes name API level 37 as the maximum the plugin supports.
detect:
  all:
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.android.compile-sdk
      present: 'true'
    - b: project.gradle.agp.version
      ver: '>=9.1.0,<9.5.0'
    - b: project.gradle.android.compile-sdk
      ver: '>37'
    - not:
        all:
          - a: project.gradle.agp.version
            ver: '>=9.1.0,<9.5.0'
          - a: project.gradle.android.compile-sdk
            ver: '>37'
severity: low
provenance:
  - url: https://developer.android.com/build/releases/past-releases/agp-9-1-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "Android Gradle plugin 9.1.1 supports Android API level 37.0 and below."'
  - url: https://developer.android.com/build/releases/past-releases/agp-9-2-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 9.2 supports is API level 37.0."'
  - url: https://developer.android.com/build/releases/past-releases/agp-9-3-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 9.3 supports is API level 37."'
  - url: https://developer.android.com/build/releases/past-releases/agp-9-4-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 9.4 supports is API level 37."'
fixtures:
  positive:
    - name: agp 9.1.0 with compileSdk 38
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '38'
      b:
        attrs:
          project.gradle.agp.version: '9.1.0'
          project.gradle.android.compile-sdk: '38'
  negative:
    - name: agp 9.1.0 with compileSdk 37 is inside the maximum
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '37'
      b:
        attrs:
          project.gradle.agp.version: '9.1.0'
          project.gradle.android.compile-sdk: '37'
    - name: agp 9.1.0 with compileSdk 38 on both sides is not new
      a:
        attrs:
          project.gradle.agp.version: '9.1.0'
          project.gradle.android.compile-sdk: '38'
      b:
        attrs:
          project.gradle.agp.version: '9.1.0'
          project.gradle.android.compile-sdk: '38'
    - name: agp 7.4.2 with compileSdk 38 is another line
      a:
        attrs:
          project.gradle.agp.version: '7.3.1'
          project.gradle.android.compile-sdk: '38'
      b:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '38'
    - name: agp 9.1.0 without a compileSdk
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.agp.version: '9.1.0'
status: active
