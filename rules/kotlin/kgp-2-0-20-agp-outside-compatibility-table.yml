schema: 1
id: kgp-2-0-20-agp-outside-compatibility-table
title: Kotlin Multiplatform plugin 2.0.20 lists Android Gradle plugin 7.4.2 through 8.5; a version outside it is untested
applies:
  - build
difference: >-
  side a is Android Gradle plugin inside 7.4.2 through 8.5 or a Kotlin outside 2.0.20; side b is Kotlin 2.0.20 with Android Gradle plugin outside 7.4.2 through 8.5
symptoms:
  - text: >-
      none is quoted; the compatibility guide lists Android Gradle plugin 7.4.2 through 8.5 for this plugin version and says nothing about versions outside it
    basis: range
mechanism: >-
  The Kotlin Multiplatform compatibility guide lists Android Gradle plugin 7.4.2 through 8.5 for Kotlin 2.0.20.
detect:
  all:
    - b: project.gradle.kotlin.version
      present: 'true'
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.kotlin.version
      ver: '>=2.0.20,<=2.0.20'
    - b: project.gradle.agp.version
      ver:
          - '<7.4.2'
          - '>8.5'
    - not:
        all:
          - a: project.gradle.kotlin.version
            ver: '>=2.0.20,<=2.0.20'
          - a: project.gradle.agp.version
            ver:
                - '<7.4.2'
                - '>8.5'
severity: medium
provenance:
  - url: https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'Version compatibility; row "2.0.20", cells "7.5-8.8" and "7.4.2-8.5"'
fixtures:
  positive:
    - name: android gradle plugin 8.5 to 7.4.1 with kotlin 2.0.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '7.4.1'
    - name: android gradle plugin 8.5 to 8.5.1 with kotlin 2.0.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '8.5'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '8.5.1'
  negative:
    - name: android gradle plugin 7.4.2 to 8.5 is inside the table
      a:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '8.5'
    - name: android gradle plugin 7.4.1 with kotlin 2.0.20 on both sides is not new
      a:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '7.4.1'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.20'
          project.gradle.agp.version: '7.4.1'
    - name: android gradle plugin 7.4.1 with kotlin 1.0.0 is outside this row
      a:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.agp.version: '7.4.1'
    - name: android gradle plugin 7.4.1 without a kotlin version
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.agp.version: '7.4.1'
status: active
