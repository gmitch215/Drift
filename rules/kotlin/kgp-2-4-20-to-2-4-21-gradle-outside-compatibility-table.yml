schema: 1
id: kgp-2-4-20-to-2-4-21-gradle-outside-compatibility-table
title: Kotlin Multiplatform plugin 2.4.20 to 2.4.21 fails to apply on Gradle below 7.6.3
applies:
  - build
difference: >-
  side a is Gradle inside 7.6.3 through 9.7.0 or a Kotlin outside 2.4.20 to 2.4.21; side b is Kotlin 2.4.20 to 2.4.21 with Gradle outside 7.6.3 through 9.7.0
symptoms:
  - text: >-
      applying the plugin fails with "Gradle Version Incompatible with Kotlin Gradle Plugin ... The applied Kotlin Gradle is not compatible with the used Gradle version (Gradle 7.5). Solution: Please update the Gradle version to at least Gradle 7.6.3."
    basis: verified
mechanism: >-
  The Kotlin Multiplatform compatibility guide lists Gradle 7.6.3 through 9.7.0 for Kotlin 2.4.20 to 2.4.21.
detect:
  all:
    - b: project.gradle.kotlin.version
      present: 'true'
    - b: project.gradle.wrapper
      present: 'true'
    - b: project.gradle.kotlin.version
      ver: '>=2.4.20,<=2.4.21'
    - b: project.gradle.wrapper
      ver: '<7.6.3'
    - not:
        all:
          - a: project.gradle.kotlin.version
            ver: '>=2.4.20,<=2.4.21'
          - a: project.gradle.wrapper
            ver: '<7.6.3'
severity: high
provenance:
  - url: https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'Version compatibility; row "2.4.20-2.4.21", cells "7.6.3-9.7.0" and "8.5.2-9.3.1"'
  - url: fixture:observed/gradle/kgp-2-4-20-gradle-7-5.txt
    kind: measurement
    verified: '2026-10-15'
fixtures:
  positive:
    - name: gradle 7.6.3 to 7.6.2 with kotlin 2.4.20
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.wrapper: '7.6.3'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.wrapper: '7.6.2'
  negative:
    - name: gradle 7.6.3 to 9.7.0 is inside the table
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.wrapper: '7.6.3'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.20'
          project.gradle.wrapper: '9.7.0'
    - name: gradle 7.6.2 with kotlin 2.4.21 on both sides is not new
      a:
        attrs:
          project.gradle.kotlin.version: '2.4.21'
          project.gradle.wrapper: '7.6.2'
      b:
        attrs:
          project.gradle.kotlin.version: '2.4.21'
          project.gradle.wrapper: '7.6.2'
    - name: gradle 7.6.2 with kotlin 1.0.0 is outside this row
      a:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.wrapper: '7.6.3'
      b:
        attrs:
          project.gradle.kotlin.version: '1.0.0'
          project.gradle.wrapper: '7.6.2'
    - name: gradle 7.6.2 without a kotlin version
      a:
        attrs:
          project.gradle.wrapper: '7.6.3'
      b:
        attrs:
          project.gradle.wrapper: '7.6.2'
status: active
