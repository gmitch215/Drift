schema: 1
id: kotlin-2-0-gradle-minimums-agp-7-1-3
title: Kotlin 2.0.0 requires Android Gradle plugin 7.1.3 or later
applies:
  - build
difference: >-
  side a is Kotlin 1.9.x with an Android Gradle plugin below 7.1.3; side b is the same project on Kotlin 2.0.0 or later
symptoms:
  - text: >-
      the Gradle or AGP build fails after the Kotlin upgrade (inferred; the page states the minimum versions, not a failure message)
    basis: inferred
mechanism: >-
  Kotlin 2.0.0 is fully compatible with Gradle 6.8.3 through 8.5, and the minimum supported Android Gradle plugin version is 7.1.3.
detect:
  all:
    - a: project.gradle.kotlin.version
      ver: '<2.0.0'
    - b: project.gradle.kotlin.version
      ver: '>=2.0.0'
    - b: project.gradle.agp.version
      ver: '<7.1.3'
severity: medium
provenance:
  - url: https://kotlinlang.org/docs/whatsnew20.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: Gradle improvements
fixtures:
  positive:
    - name: kotlin 1.9.24 to kotlin 2.0.0 on agp 7.0.4
      a:
        attrs:
          project.gradle.kotlin.version: '1.9.24'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.0'
          project.gradle.agp.version: '7.0.4'
  negative:
    - name: kotlin 2.0.0 on agp 8.5.0
      a:
        attrs:
          project.gradle.kotlin.version: '1.9.24'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.0'
          project.gradle.agp.version: '8.5.0'
    - name: kotlin 2.0.0 on both sides with agp 7.0.4
      a:
        attrs:
          project.gradle.kotlin.version: '2.0.0'
          project.gradle.agp.version: '7.0.4'
      b:
        attrs:
          project.gradle.kotlin.version: '2.0.21'
          project.gradle.agp.version: '7.0.4'
status: active
