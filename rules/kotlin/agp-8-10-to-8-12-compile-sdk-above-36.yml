schema: 1
id: agp-8-10-to-8-12-compile-sdk-above-36
title: AGP 8.10 to 8.12 lists API level 36 as its maximum, so a higher compileSdk is untested
applies:
  - build
difference: >-
  side a is a project on an AGP outside 8.10 to 8.12; side b is the same project on that AGP with compileSdk above 36
symptoms:
  - text: >-
      none is quoted for these releases; the release notes name the maximum API level and no failure above it
    basis: range
mechanism: >-
  The Android Gradle plugin 8.10 to 8.12 release notes name API level 36 as the maximum the plugin supports.
detect:
  all:
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.android.compile-sdk
      present: 'true'
    - b: project.gradle.agp.version
      ver: '>=8.10.0,<8.13.0'
    - b: project.gradle.android.compile-sdk
      ver: '>36'
    - not:
        all:
          - a: project.gradle.agp.version
            ver: '>=8.10.0,<8.13.0'
          - a: project.gradle.android.compile-sdk
            ver: '>36'
severity: low
provenance:
  - url: https://developer.android.com/build/releases/past-releases/agp-8-10-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle Plugin 8.10 supports is API level 36."'
  - url: https://developer.android.com/build/releases/past-releases/agp-8-11-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle Plugin 8.11 supports is API level 36."'
  - url: https://developer.android.com/build/releases/past-releases/agp-8-12-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle Plugin 8.12 supports is API level 36."'
fixtures:
  positive:
    - name: agp 8.10.0 with compileSdk 37
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '37'
      b:
        attrs:
          project.gradle.agp.version: '8.10.0'
          project.gradle.android.compile-sdk: '37'
  negative:
    - name: agp 8.10.0 with compileSdk 36 is inside the maximum
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '36'
      b:
        attrs:
          project.gradle.agp.version: '8.10.0'
          project.gradle.android.compile-sdk: '36'
    - name: agp 8.10.0 with compileSdk 37 on both sides is not new
      a:
        attrs:
          project.gradle.agp.version: '8.10.0'
          project.gradle.android.compile-sdk: '37'
      b:
        attrs:
          project.gradle.agp.version: '8.10.0'
          project.gradle.android.compile-sdk: '37'
    - name: agp 7.4.2 with compileSdk 37 is another line
      a:
        attrs:
          project.gradle.agp.version: '7.3.1'
          project.gradle.android.compile-sdk: '37'
      b:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '37'
    - name: agp 8.10.0 without a compileSdk
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.agp.version: '8.10.0'
status: active
