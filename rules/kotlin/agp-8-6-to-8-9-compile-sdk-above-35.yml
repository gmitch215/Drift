schema: 1
id: agp-8-6-to-8-9-compile-sdk-above-35
title: AGP 8.6 to 8.9 lists API level 35 as its maximum, so a higher compileSdk is untested
applies:
  - build
difference: >-
  side a is a project on an AGP outside 8.6 to 8.9; side b is the same project on that AGP with compileSdk above 35
symptoms:
  - text: >-
      none is quoted for these releases; the release notes name the maximum API level and no failure above it
    basis: range
mechanism: >-
  The Android Gradle plugin 8.6 to 8.9 release notes name API level 35 as the maximum the plugin supports.
detect:
  all:
    - b: project.gradle.agp.version
      present: 'true'
    - b: project.gradle.android.compile-sdk
      present: 'true'
    - b: project.gradle.agp.version
      ver: '>=8.6.0,<8.10.0'
    - b: project.gradle.android.compile-sdk
      ver: '>35'
    - not:
        all:
          - a: project.gradle.agp.version
            ver: '>=8.6.0,<8.10.0'
          - a: project.gradle.android.compile-sdk
            ver: '>35'
severity: low
provenance:
  - url: https://developer.android.com/build/releases/past-releases/agp-8-6-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 8.6 supports is API level 35."'
  - url: https://developer.android.com/build/releases/past-releases/agp-8-7-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 8.7 supports is API level 35."'
  - url: https://developer.android.com/build/releases/past-releases/agp-8-8-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 8.8 supports is API level 35."'
  - url: https://developer.android.com/build/releases/past-releases/agp-8-9-0-release-notes
    kind: release-note
    verified: '2026-10-15'
    section: 'Compatibility; "The maximum API level that Android Gradle plugin 8.9 supports is API level 35."'
fixtures:
  positive:
    - name: agp 8.6.0 with compileSdk 36
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '36'
      b:
        attrs:
          project.gradle.agp.version: '8.6.0'
          project.gradle.android.compile-sdk: '36'
  negative:
    - name: agp 8.6.0 with compileSdk 35 is inside the maximum
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '35'
      b:
        attrs:
          project.gradle.agp.version: '8.6.0'
          project.gradle.android.compile-sdk: '35'
    - name: agp 8.6.0 with compileSdk 36 on both sides is not new
      a:
        attrs:
          project.gradle.agp.version: '8.6.0'
          project.gradle.android.compile-sdk: '36'
      b:
        attrs:
          project.gradle.agp.version: '8.6.0'
          project.gradle.android.compile-sdk: '36'
    - name: agp 7.4.2 with compileSdk 36 is another line
      a:
        attrs:
          project.gradle.agp.version: '7.3.1'
          project.gradle.android.compile-sdk: '36'
      b:
        attrs:
          project.gradle.agp.version: '7.4.2'
          project.gradle.android.compile-sdk: '36'
    - name: agp 8.6.0 without a compileSdk
      a:
        attrs:
          project.gradle.agp.version: '7.4.2'
      b:
        attrs:
          project.gradle.agp.version: '8.6.0'
status: active
