schema: 1
id: symfony-6-1-php-8-1-minimum
title: Symfony 6.1 declares PHP 8.1 or higher, so a PHP 8.0 host cannot install it
applies:
  - runtime
difference: >-
  side a is PHP 8.1 or higher with Symfony 6.1 or later in the 6.x line; side b is PHP below 8.1 with the same Symfony 6.x line
symptoms:
  - text: Composer refuses to resolve symfony/http-kernel 6.1 or later on PHP below 8.1
    basis: inferred
mechanism: Symfony 6.1.0 declares require.php as >=8.1 in its composer.json, while 6.0.0 declares >=8.0.2.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.1'
    - b: tool.php.version
      ver: '<8.1'
    - a: project.composer.symfony/http-kernel
      ver: '>=6.1,<7'
    - b: project.composer.symfony/http-kernel
      ver: '>=6.1,<7'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/symfony/symfony/v6.1.0/composer.json
    kind: spec
    verified: '2026-10-13'
    section: require.php
  - url: https://raw.githubusercontent.com/symfony/symfony/v6.0.0/composer.json
    kind: spec
    verified: '2026-10-13'
    section: require.php
fixtures:
  positive:
    - name: php 8.1.27 with symfony 6.1.0 to php 8.0.30 with symfony 6.1.0
      a: {attrs: {tool.php.version: '8.1.27', project.composer.symfony/http-kernel: '6.1.0'}}
      b: {attrs: {tool.php.version: '8.0.30', project.composer.symfony/http-kernel: '6.1.0'}}
  negative:
    - name: php 8.0.30 to php 8.1.27 with symfony 6.1.0 (reverse direction)
      a: {attrs: {tool.php.version: '8.0.30', project.composer.symfony/http-kernel: '6.1.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.symfony/http-kernel: '6.1.0'}}
    - name: php 8.1.27 to php 8.0.30 with symfony 6.0.0 (not 6.1 or later)
      a: {attrs: {tool.php.version: '8.1.27', project.composer.symfony/http-kernel: '6.0.0'}}
      b: {attrs: {tool.php.version: '8.0.30', project.composer.symfony/http-kernel: '6.0.0'}}
    - name: php 8.1.27 to php 8.1.27 with symfony 6.1.0 (same band)
      a: {attrs: {tool.php.version: '8.1.27', project.composer.symfony/http-kernel: '6.1.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.symfony/http-kernel: '6.1.0'}}
status: active
