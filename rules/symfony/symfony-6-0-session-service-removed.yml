schema: 1
id: symfony-6-0-session-service-removed
title: Symfony 6.0 removes the session service and the SessionInterface alias, so code that fetches session from the container fails
applies:
  - build
difference: >-
  side a is Symfony 5.x where the session service or SessionInterface autowiring resolves; side b is Symfony 6.x with the same code
symptoms:
  - text: service-not-found error at container lookup or autowiring
    basis: inferred
mechanism: UPGRADE-6.0.md in section FrameworkBundle says the session service and the SessionInterface alias were removed.
detect:
  all:
    - a: project.composer.symfony/http-kernel
      ver: '>=5,<6'
    - b: project.composer.symfony/http-kernel
      ver: '>=6,<7'
    - b: project.symfony.source.session-service-lookup
      present: 'true'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/symfony/symfony/v6.0.0/UPGRADE-6.0.md
    kind: release-note
    verified: '2026-10-13'
    section: FrameworkBundle
fixtures:
  positive:
    - name: symfony 5.4.0 to symfony 6.0.0 with a session service lookup
      a: {attrs: {project.composer.symfony/http-kernel: '5.4.0'}}
      b: {attrs: {project.composer.symfony/http-kernel: '6.0.0', project.symfony.source.session-service-lookup: 'true'}}
  negative:
    - name: symfony 6.0.0 to symfony 5.4.0 with a session service lookup (reverse direction)
      a: {attrs: {project.composer.symfony/http-kernel: '6.0.0', project.symfony.source.session-service-lookup: 'true'}}
      b: {attrs: {project.composer.symfony/http-kernel: '5.4.0'}}
    - name: symfony 5.4.0 to symfony 6.0.0 without a session service lookup
      a: {attrs: {project.composer.symfony/http-kernel: '5.4.0'}}
      b: {attrs: {project.composer.symfony/http-kernel: '6.0.0'}}
status: active
