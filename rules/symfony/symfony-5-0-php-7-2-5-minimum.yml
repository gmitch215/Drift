schema: 1
id: symfony-5-0-php-7-2-5-minimum
title: Symfony 5.0 declares PHP ^7.2.5, so a host below PHP 7.2.5 cannot install it
applies:
  - runtime
difference: >-
  side a is PHP 7.2.5 up to 8.0 with Symfony 5.x; side b is PHP below 7.2.5 with the same Symfony 5.x
symptoms:
  - text: Composer refuses to resolve symfony/http-kernel 5.x on PHP below 7.2.5
    basis: inferred
mechanism: Symfony 5.0.0 declares require.php as ^7.2.5 in its composer.json.
detect:
  all:
    - a: tool.php.version
      ver: '>=7.2.5,<8'
    - b: tool.php.version
      ver: '<7.2.5'
    - a: project.composer.symfony/http-kernel
      ver: '>=5,<6'
    - b: project.composer.symfony/http-kernel
      ver: '>=5,<6'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/symfony/symfony/v5.0.0/composer.json
    kind: spec
    verified: '2026-10-13'
    section: require.php
fixtures:
  positive:
    - name: php 7.4.33 with symfony 5.0.0 to php 7.1.3 with symfony 5.0.0
      a: {attrs: {tool.php.version: '7.4.33', project.composer.symfony/http-kernel: '5.0.0'}}
      b: {attrs: {tool.php.version: '7.1.3', project.composer.symfony/http-kernel: '5.0.0'}}
  negative:
    - name: php 7.1.3 to php 7.4.33 with symfony 5.0.0 (reverse direction)
      a: {attrs: {tool.php.version: '7.1.3', project.composer.symfony/http-kernel: '5.0.0'}}
      b: {attrs: {tool.php.version: '7.4.33', project.composer.symfony/http-kernel: '5.0.0'}}
    - name: php 8.2.12 to php 7.1.3 with symfony 5.0.0 (passing side outside the caret range)
      a: {attrs: {tool.php.version: '8.2.12', project.composer.symfony/http-kernel: '5.0.0'}}
      b: {attrs: {tool.php.version: '7.1.3', project.composer.symfony/http-kernel: '5.0.0'}}
    - name: php 7.4.33 to php 7.1.3 with symfony 4.4.9 (not a symfony 5 host)
      a: {attrs: {tool.php.version: '7.4.33', project.composer.symfony/http-kernel: '4.4.9'}}
      b: {attrs: {tool.php.version: '7.1.3', project.composer.symfony/http-kernel: '4.4.9'}}
status: active
