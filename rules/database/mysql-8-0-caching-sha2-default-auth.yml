schema: 1
id: mysql-8-0-caching-sha2-default-auth
title: MySQL 8.0 makes caching_sha2_password the default authentication plugin in place of mysql_native_password
applies:
  - runtime
difference: >-
  side a is MySQL 5.7 (mysql_native_password default); side b is MySQL 8.0 (caching_sha2_password default)
symptoms:
  - text: clients or drivers without caching_sha2_password support fail to authenticate against accounts created on the new server
    basis: inferred
mechanism: >-
  The MySQL 8.0 release notes state that caching_sha2_password is the preferred authentication plugin and is also the default authentication plugin rather than mysql_native_password.
detect:
  all:
    - a: runtime.database.server.kind
      eq: mysql
    - a: runtime.database.server.version
      ver: '<8.0.0'
    - b: runtime.database.server.kind
      eq: mysql
    - b: runtime.database.server.version
      ver: '>=8.0.0'
    - b: runtime.database.server.default-auth-plugin
      eq: caching_sha2_password
severity: medium
provenance:
  - url: https://dev.mysql.com/doc/refman/8.0/en/mysql-nutshell.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Features Added in MySQL 8.0, Security and account management'
fixtures:
  positive:
    - name: mysql 5.7.44 to mysql 8.0.36 with the 8.0 default plugin
      a:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '5.7.44'
          runtime.database.server.default-auth-plugin: mysql_native_password
      b:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.0.36'
          runtime.database.server.default-auth-plugin: caching_sha2_password
  negative:
    - name: mysql 8.0.36 to mysql 5.7.44 (reverse direction)
      a:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.0.36'
          runtime.database.server.default-auth-plugin: caching_sha2_password
      b:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '5.7.44'
          runtime.database.server.default-auth-plugin: mysql_native_password
    - name: mysql 8.0.36 with the plugin reset to mysql_native_password
      a:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '5.7.44'
          runtime.database.server.default-auth-plugin: mysql_native_password
      b:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.0.36'
          runtime.database.server.default-auth-plugin: mysql_native_password
status: pending-scanner
