schema: 1
id: postgres-14-password-encryption-scram-default
title: PostgreSQL 14 changes the default password_encryption to scram-sha-256 in place of md5
applies:
  - runtime
difference: >-
  side a is PostgreSQL 13 or lower with password_encryption md5; side b is PostgreSQL 14 or higher with password_encryption scram-sha-256
symptoms:
  - text: a client or driver that supports only md5 cannot authenticate to a role whose password was set on the new server
    basis: inferred
mechanism: >-
  The PostgreSQL 14 release notes state that the default of password_encryption changed to scram-sha-256, so new passwords are stored as SHA256 unless the setting is changed or the password is given in MD5 format.
detect:
  all:
    - a: runtime.database.server.kind
      eq: postgres
    - a: runtime.database.server.version
      ver: '<14.0'
    - a: runtime.database.server.password-encryption
      eq: md5
    - b: runtime.database.server.kind
      eq: postgres
    - b: runtime.database.server.version
      ver: '>=14.0'
    - b: runtime.database.server.password-encryption
      eq: scram-sha-256
severity: medium
provenance:
  - url: https://www.postgresql.org/docs/14/release-14.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Migration to Version 14'
fixtures:
  positive:
    - name: postgres 13.14 with md5 to postgres 14.11 with scram-sha-256
      a:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '13.14'
          runtime.database.server.password-encryption: md5
      b:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '14.11'
          runtime.database.server.password-encryption: scram-sha-256
  negative:
    - name: postgres 14.11 with scram-sha-256 to postgres 13.14 with md5 (reverse direction)
      a:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '14.11'
          runtime.database.server.password-encryption: scram-sha-256
      b:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '13.14'
          runtime.database.server.password-encryption: md5
    - name: postgres 13.14 with md5 to postgres 14.11 with md5 kept by configuration
      a:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '13.14'
          runtime.database.server.password-encryption: md5
      b:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '14.11'
          runtime.database.server.password-encryption: md5
    - name: postgres 13.14 with scram-sha-256 to postgres 14.11 with scram-sha-256
      a:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '13.14'
          runtime.database.server.password-encryption: scram-sha-256
      b:
        attrs:
          runtime.database.server.kind: postgres
          runtime.database.server.version: '14.11'
          runtime.database.server.password-encryption: scram-sha-256
status: pending-scanner
