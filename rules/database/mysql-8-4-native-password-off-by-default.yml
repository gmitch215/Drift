schema: 1
id: mysql-8-4-native-password-off-by-default
title: MySQL 8.4.0 stops enabling mysql_native_password by default
applies:
  - runtime
difference: >-
  side a is MySQL 8.0 (mysql_native_password enabled); side b is MySQL 8.4.0 or higher (disabled unless the server is started with the option)
symptoms:
  - text: accounts that authenticate with mysql_native_password fail to log in on 8.4 unless the server option is set
    basis: inferred
mechanism: >-
  The MySQL 8.4 release notes state that the deprecated mysql_native_password plugin is no longer enabled by default and can be enabled with --mysql-native-password=ON.
detect:
  all:
    - a: runtime.database.server.kind
      eq: mysql
    - a: runtime.database.server.version
      ver: '>=8.0.0,<8.4.0'
    - b: runtime.database.server.kind
      eq: mysql
    - b: runtime.database.server.version
      ver: '>=8.4.0'
    - b: runtime.database.server.native-password-enabled
      eq: 'false'
severity: high
provenance:
  - url: https://dev.mysql.com/doc/refman/8.4/en/mysql-nutshell.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Features Added or Changed in MySQL 8.4, MySQL native password authentication changes'
fixtures:
  positive:
    - name: mysql 8.0.36 with the plugin enabled to mysql 8.4.0 with the plugin disabled
      a:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.0.36'
          runtime.database.server.native-password-enabled: 'true'
      b:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.4.0'
          runtime.database.server.native-password-enabled: 'false'
  negative:
    - name: mysql 8.4.0 with the plugin enabled by option on the target
      a:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.0.36'
          runtime.database.server.native-password-enabled: 'true'
      b:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.4.0'
          runtime.database.server.native-password-enabled: 'true'
    - name: mysql 8.4.0 to mysql 8.4.0 (no version crossing)
      a:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.4.0'
          runtime.database.server.native-password-enabled: 'true'
      b:
        attrs:
          runtime.database.server.kind: mysql
          runtime.database.server.version: '8.4.0'
          runtime.database.server.native-password-enabled: 'false'
status: pending-scanner
