schema: 1
id: openssl-3-tls10-tls11-need-seclevel-0
title: OpenSSL 3.0 at its default security level 1 refuses TLS 1.0 and TLS 1.1 handshakes unless the level is lowered
applies:
  - runtime
  - network
difference: >-
  a = a process linked against OpenSSL before 3.0 (1.1.1), where TLS 1.0 and 1.1 work; b = a process linked against OpenSSL 3.x at the default security level, talking to a peer that offers TLS 1.0 or TLS 1.1
symptoms:
  - text: a client or server that negotiates TLS 1.0 or 1.1 with a peer fails with a handshake error on OpenSSL 3.x with no application code change (error text not checked)
    basis: inferred
mechanism: OpenSSL 3.0 reduces the strength of SHA-1 and MD5 TLS signatures, so TLS 1.0 and TLS 1.1 no longer work at the default security level of 1 and need security level 0.
detect:
  all:
    - a: tool.openssl.version
      ver: '<3.0.0'
    - b: tool.openssl.version
      ver: '>=3.0.0'
    - any:
        - b: network.tls-version-offered
          has: TLSv1.0
        - b: network.tls-version-offered
          has: TLSv1.1
severity: medium
provenance:
  - url: https://docs.openssl.org/3.0/man7/migration_guide/
    kind: vendor-doc
    verified: '2026-10-13'
    section: TLS Changes
fixtures:
  positive:
    - name: the passing side runs OpenSSL 1.1.1 and the failing side runs OpenSSL 3.0.13 against a peer that offers TLSv1.0
      a:
        attrs:
          tool.openssl.version: '1.1.1'
      b:
        attrs:
          tool.openssl.version: '3.0.13'
          network.tls-version-offered: TLSv1.0 TLSv1.2
  negative:
    - name: the failing side runs OpenSSL 3.0.13 against a peer that offers only TLS 1.2 and 1.3
      a:
        attrs:
          tool.openssl.version: '1.1.1'
      b:
        attrs:
          tool.openssl.version: '3.0.13'
          network.tls-version-offered: TLSv1.2 TLSv1.3
    - name: both sides run OpenSSL 3.0.13 against a peer that offers TLSv1.1
      a:
        attrs:
          tool.openssl.version: '3.0.13'
          network.tls-version-offered: TLSv1.1
      b:
        attrs:
          tool.openssl.version: '3.0.13'
          network.tls-version-offered: TLSv1.1
status: pending-scanner
