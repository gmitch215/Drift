schema: 1
id: vite-7-node-20-19-minimum
title: Vite 7 declares engines.node ^20.19.0 || >=22.12.0, so a Node version outside that range is unsupported
applies:
  - runtime
  - build
difference: >-
  side a is a Node version inside the engines range of Vite 7 and side b is a Node version outside it, with the same Vite 7 release on side b
symptoms:
  - text: 'npm reports EBADENGINE for vite on the unsupported Node version, and the package may fail to start'
    basis: inferred
mechanism: >-
  The registry document of vite 7.0.0 declares engines.node ^20.19.0 || >=22.12.0, so a Node version outside that range is unsupported by Vite 7.
detect:
  all:
    - a: tool.node.version
      ver:
        - '>=20.19.0,<21.0.0'
        - '>=22.12.0'
    - b: tool.node.version
      ver:
        - '<20.19.0'
        - '>=21.0.0,<22.12.0'
    - b: project.npm.vite
      ver: '>=7.0.0'
severity: medium
provenance:
  - url: https://registry.npmjs.org/vite/7.0.0
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'engines of vite 7.0.0: "engines":{"node":"^20.19.0 || >=22.12.0"}'
fixtures:
  positive:
    - name: 'Vite 7 on node 22.12.0 to node 18.20.4'
      a:
        attrs:
          tool.node.version: '22.12.0'
      b:
        attrs:
          tool.node.version: '18.20.4'
          project.npm.vite: '7.0.0'
  negative:
    - name: 'vite 6.4.1 is below the first release with this range'
      a:
        attrs:
          tool.node.version: '22.12.0'
      b:
        attrs:
          tool.node.version: '18.20.4'
          project.npm.vite: '6.4.1'
    - name: 'node 22.12.0 is inside the range on both sides'
      a:
        attrs:
          tool.node.version: '22.12.0'
      b:
        attrs:
          tool.node.version: '22.12.0'
          project.npm.vite: '7.0.0'
status: active
