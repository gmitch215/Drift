schema: 1
id: docker-28-ipv6-default-bridge-ipam
title: Docker Engine 28 assigns IPv6 addresses in the default bridge network from IPAM
applies:
  - network
difference: >-
  the passing run used a Docker Engine before 28.0.0, where the IPv6 address is derived from the container MAC address, and the failing run used Docker Engine 28.0.0 or later with IPAM-assigned IPv6 addresses
symptoms:
  - text: >-
      a container IPv6 address changes after the upgrade, so firewall rules, DNS entries or hard-coded peer addresses can break; the release note states the change, not the symptom
    basis: inferred
mechanism: >-
  IPv6 addresses in the default bridge network are IPAM-assigned from Docker Engine 28.0.0 instead of being derived from the MAC address.
detect:
  all:
    - a: tool.docker.version
      ver: '<28.0.0'
    - b: tool.docker.version
      ver: '>=28.0.0'
    - b: tool.docker.ipv6
      eq: 'true'
severity: low
provenance:
  - url: https://docs.docker.com/engine/release-notes/28/
    kind: release-note
    verified: '2026-10-13'
    section: 28.0.0 release notes, networking entries
fixtures:
  positive:
    - name: Docker 27.3.1 then Docker 28.0.0 with IPv6 enabled
      a:
        attrs:
          tool.docker.version: '27.3.1'
          tool.docker.ipv6: 'true'
      b:
        attrs:
          tool.docker.version: '28.0.0'
          tool.docker.ipv6: 'true'
  negative:
    - name: Docker 28.0.0 with IPv6 disabled
      a:
        attrs:
          tool.docker.version: '27.3.1'
          tool.docker.ipv6: 'false'
      b:
        attrs:
          tool.docker.version: '28.0.0'
          tool.docker.ipv6: 'false'
    - name: both runs on Docker 28
      a:
        attrs:
          tool.docker.version: '28.0.0'
          tool.docker.ipv6: 'true'
      b:
        attrs:
          tool.docker.version: '28.0.1'
          tool.docker.ipv6: 'true'
status: pending-scanner
