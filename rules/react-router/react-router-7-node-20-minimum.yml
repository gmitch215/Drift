schema: 1
id: react-router-7-node-20-minimum
title: React Router 7 declares engines.node >=20.0.0, so a Node version outside that range is unsupported
applies:
  - runtime
  - build
difference: >-
  side a is a Node version inside the engines range of React Router 7 and side b is a Node version outside it, with the same React Router 7 release on side b
symptoms:
  - text: 'npm reports EBADENGINE for react-router on the unsupported Node version, and the package may fail to start'
    basis: inferred
mechanism: >-
  The registry document of react-router 7.0.0 declares engines.node >=20.0.0, so a Node version outside that range is unsupported by React Router 7.
detect:
  all:
    - a: tool.node.version
      ver: '>=20.0.0'
    - b: tool.node.version
      ver: '<20.0.0'
    - b: project.npm.react-router
      ver: '>=7.0.0'
severity: medium
provenance:
  - url: https://registry.npmjs.org/react-router/7.0.0
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'engines of react-router 7.0.0: "engines":{"node":">=20.0.0"}'
fixtures:
  positive:
    - name: 'React Router 7 on node 22.11.0 to node 18.20.4'
      a:
        attrs:
          tool.node.version: '22.11.0'
      b:
        attrs:
          tool.node.version: '18.20.4'
          project.npm.react-router: '7.0.0'
  negative:
    - name: 'react-router 6.30.1 is below the first release with this range'
      a:
        attrs:
          tool.node.version: '22.11.0'
      b:
        attrs:
          tool.node.version: '18.20.4'
          project.npm.react-router: '6.30.1'
    - name: 'node 22.11.0 is inside the range on both sides'
      a:
        attrs:
          tool.node.version: '22.11.0'
      b:
        attrs:
          tool.node.version: '22.11.0'
          project.npm.react-router: '7.0.0'
status: active
