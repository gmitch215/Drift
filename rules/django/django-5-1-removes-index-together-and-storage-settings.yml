schema: 1
id: django-5-1-removes-index-together-and-storage-settings
title: Django 5.1 removes Meta.index_together, DEFAULT_FILE_STORAGE, STATICFILES_STORAGE, get_storage_class and make_random_password
applies:
  - runtime
difference: >-
  side a is Django below 5.1; side b is Django 5.1 or newer with source that still uses the removed names
symptoms:
  - text: 'ImportError: cannot import name ''get_storage_class'' from ''django.core.files.storage'''
    basis: verified
mechanism: The 5.1 release notes list these options and functions under Features removed in 5.1.
detect:
  all:
    - a: project.python.django
      ver: '<5.1'
    - b: project.python.django
      ver: '>=5.1'
    - b: project.django.source.removed-5-1-names
      present: 'true'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/django/django/5.1/docs/releases/5.1.txt
    kind: release-note
    verified: '2026-10-15'
    section: 'Features removed in 5.1'
fixtures:
  positive:
    - name: django 4.2.30 to django 5.1.15 with the removed names in the source
      a: {attrs: {project.python.django: '4.2.30'}}
      b: {attrs: {project.python.django: '5.1.15', project.django.source.removed-5-1-names: 'true'}}
  negative:
    - name: django 5.1.15 to django 4.2.30 with the removed names in the source (reverse direction)
      a: {attrs: {project.python.django: '5.1.15', project.django.source.removed-5-1-names: 'true'}}
      b: {attrs: {project.python.django: '4.2.30'}}
    - name: django 4.2.30 to django 5.1.15 without the removed names in the source
      a: {attrs: {project.python.django: '4.2.30'}}
      b: {attrs: {project.python.django: '5.1.15'}}
    - name: django 4.2.30 to django 4.2.30 with the removed names in the source (no version move)
      a: {attrs: {project.python.django: '4.2.30'}}
      b: {attrs: {project.python.django: '4.2.30', project.django.source.removed-5-1-names: 'true'}}
status: active
