schema: 1
id: django-5-python-3-10-minimum
title: Django 5.x requires Python 3.10 or newer, so a Python below 3.10 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.10 or newer with Django 5.x; side b is Python below 3.10 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for django==5.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for django 5.0 gives requires_python ">=3.10" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.10'
    - b: tool.python.version
      ver: '<3.10'
    - a: project.python.django
      ver: '>=5,<6'
    - b: project.python.django
      ver: '>=5,<6'
severity: high
provenance:
  - url: https://pypi.org/pypi/django/5.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.12.4 to python 3.9.19 with django 5.0.14
      a: {attrs: {tool.python.version: '3.12.4', project.python.django: '5.0.14'}}
      b: {attrs: {tool.python.version: '3.9.19', project.python.django: '5.0.14'}}
  negative:
    - name: python 3.9.19 to python 3.12.4 with django 5.0.14 (reverse direction)
      a: {attrs: {tool.python.version: '3.9.19', project.python.django: '5.0.14'}}
      b: {attrs: {tool.python.version: '3.12.4', project.python.django: '5.0.14'}}
    - name: python 3.12.4 to python 3.9.19 with django 4.2.30 (outside the release line)
      a: {attrs: {tool.python.version: '3.12.4', project.python.django: '4.2.30'}}
      b: {attrs: {tool.python.version: '3.9.19', project.python.django: '4.2.30'}}
    - name: python 3.9.19 to python 3.9.19 with django 5.0.14 (same band)
      a: {attrs: {tool.python.version: '3.9.19', project.python.django: '5.0.14'}}
      b: {attrs: {tool.python.version: '3.9.19', project.python.django: '5.0.14'}}
status: active
