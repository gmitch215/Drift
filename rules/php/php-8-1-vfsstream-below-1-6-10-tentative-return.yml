schema: 1
id: php-8-1-vfsstream-below-1-6-10-tentative-return
title: PHP 8.1 breaks vfsStream releases before 1.6.10 that override getIterator() without a return type
applies:
  - runtime
difference: >-
  side a is PHP 8.0 or older with mikey179/vfsstream below 1.6.10, where vfsStreamDirectory::getIterator() has no
  return type; side b is PHP 8.1 or newer, where the missing compatible return type is a deprecated notice during
  inheritance, and a test runner that turns deprecations into exceptions stops the run with a fatal error
symptoms:
  - text: 'a deprecated notice during inheritance validation for vfsStreamDirectory::getIterator(), as the PHP 8.1 UPGRADING notice describes'
    basis: verified
  - text: 'Fatal error: During inheritance of IteratorAggregate: Uncaught Return type of org\bovigo\vfs\vfsStreamDirectory::getIterator() should either be compatible with IteratorAggregate::getIterator(): Traversable, or the #[\ReturnTypeWillChange] attribute should be used'
    basis: inferred
mechanism: >-
  PHP 8.1 emits a deprecated notice when an internal interface method is implemented without a compatible return type, and vfsStream 1.6.8 and 1.6.9 implement getIterator() without one.
detect:
  all:
    - a: tool.php.version
      ver: '<8.1.0'
    - b: tool.php.version
      ver: '>=8.1.0'
    - a: project.composer.mikey179/vfsstream
      ver: '<1.6.10'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/php/php-src/PHP-8.1/UPGRADING
    kind: release-note
    verified: '2026-10-13'
    section: '1. Backward Incompatible Changes, Core'
  - url: https://raw.githubusercontent.com/bovigo/vfsStream/v1.6.10/src/main/php/org/bovigo/vfs/vfsStreamDirectory.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: 'getIterator() declares #[\ReturnTypeWillChange] at v1.6.10; v1.6.9 and v1.6.8 declare none'
fixtures:
  positive:
    - name: php 7.4.33 with vfsstream 1.6.8 to php 8.3.35 (case D)
      a:
        attrs:
          tool.php.version: '7.4.33'
          project.composer.mikey179/vfsstream: 'v1.6.8'
      b:
        attrs:
          tool.php.version: '8.3.35'
    - name: php 8.0.30 with vfsstream 1.6.9 to php 8.1.34
      a:
        attrs:
          tool.php.version: '8.0.30'
          project.composer.mikey179/vfsstream: '1.6.9'
      b:
        attrs:
          tool.php.version: '8.1.34'
  negative:
    - name: php 7.4.33 with vfsstream 1.6.10 to php 8.3.35 (fixed release)
      a:
        attrs:
          tool.php.version: '7.4.33'
          project.composer.mikey179/vfsstream: '1.6.10'
      b:
        attrs:
          tool.php.version: '8.3.35'
    - name: php 8.1.34 with vfsstream 1.6.8 to php 8.3.35 (already on 8.1)
      a:
        attrs:
          tool.php.version: '8.1.34'
          project.composer.mikey179/vfsstream: '1.6.8'
      b:
        attrs:
          tool.php.version: '8.3.35'
    - name: php 8.3.35 with vfsstream 1.6.8 to php 7.4.33 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.3.35'
          project.composer.mikey179/vfsstream: '1.6.8'
      b:
        attrs:
          tool.php.version: '7.4.33'
    - name: php 7.4.33 without vfsstream to php 8.3.35
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '8.3.35'
status: active
