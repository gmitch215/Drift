schema: 1
id: php-8-0-create-function-each-removed
title: PHP 8.0 removes create_function(), each() and __autoload()
applies:
  - runtime
difference: >-
  side a is PHP below 8.0, where these functions exist with deprecation notices; side b is PHP 8.0 or newer,
  where they do not
symptoms:
  - text: a fatal undefined-function error on the first call to create_function() or each(); __autoload() is no longer run
    basis: inferred
mechanism: >-
  The PHP 8.0 page lists create_function() as removed (anonymous functions may be used instead), each() as
  removed (foreach or ArrayIterator should be used instead) and the __autoload() ability as removed
  (spl_autoload_register() should be used instead).
detect:
  all:
    - a: tool.php.version
      ver: '<8.0.0'
    - b: tool.php.version
      ver: '>=8.0.0'
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration80.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
fixtures:
  positive:
    - name: php 7.4.33 to php 8.4.26
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '8.4.26'
  negative:
    - name: php 8.4.26 to php 7.4.33 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.4.26'
      b:
        attrs:
          tool.php.version: '7.4.33'
    - name: php 8.1.34 to php 8.4.26 (both sides on or after 8.0)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
