schema: 1
id: php-8-0-get-debug-type-added
title: PHP 8.0 adds get_debug_type
applies:
  - runtime
difference: >-
  the PHP version is 8.0 or newer on the passing side and older than 8.0 on the failing side
symptoms:
  - text: "Call to undefined function get_debug_type()"
    basis: inferred
mechanism: PHP 8.0 adds the get_debug_type function, so a call to it fails on earlier PHP versions.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.0.0'
    - b: tool.php.version
      ver: '<8.0.0'
    - b: project.php.calls.get_debug_type
      present: 'true'
severity: medium
provenance:
  - url: https://raw.githubusercontent.com/php/php-src/PHP-8.0/UPGRADING
    kind: vendor-doc
    verified: '2026-10-13'
    section: "PHP-8.0 UPGRADING: Added get_debug_type() function (raw, line 985)"
fixtures:
  positive:
    - name: "php 7.4.33 target using get_debug_type (8.3.12 to 7.4.33)"
      a:
        attrs:
          tool.php.version: '8.3.12'
      b:
        attrs:
          tool.php.version: '7.4.33'
          project.php.calls.get_debug_type: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.php.version: '8.3.12'
      b:
        attrs:
          tool.php.version: '7.4.33'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.php.version: '8.3.12'
      b:
        attrs:
          tool.php.version: '8.3.12'
          project.php.calls.get_debug_type: 'true'
status: active
