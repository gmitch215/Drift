schema: 1
id: php-7-0-hex-string-not-numeric
title: PHP 7.0 stops treating hexadecimal strings as numeric
applies:
  - runtime
difference: >-
  the PHP version is below 7.0 on the passing side, where a hex-looking string is numeric, and 7.0 or newer
  on the failing side
symptoms:
  - text: '"0x123" == "291" is true on PHP 5 and false on PHP 7.0 and later; is_numeric("0x123") changes the same way'
    basis: verified
mechanism: >-
  The PHP 7.0 page states that strings containing hexadecimal numbers are no longer considered to be numeric.
detect:
  all:
    - a: tool.php.version
      ver: '<7.0.0'
    - b: tool.php.version
      ver: '>=7.0.0'
severity: medium
provenance:
  - url: https://www.php.net/manual/en/migration70.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: Changes to string handling
fixtures:
  positive:
    - name: php 5.6.40 to php 7.4.33
      a:
        attrs:
          tool.php.version: '5.6.40'
      b:
        attrs:
          tool.php.version: '7.4.33'
  negative:
    - name: php 7.4.33 to php 5.6.40 (reverse direction)
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '5.6.40'
    - name: php 7.0.33 to php 8.4.26 (both sides on or after 7.0)
      a:
        attrs:
          tool.php.version: '7.0.33'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
