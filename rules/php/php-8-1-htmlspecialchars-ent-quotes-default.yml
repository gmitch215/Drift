schema: 1
id: php-8-1-htmlspecialchars-ent-quotes-default
title: PHP 8.1 changes the default flags of htmlspecialchars() and related functions to ENT_QUOTES
applies:
  - runtime
difference: >-
  side a is PHP below 8.1, where the default is ENT_COMPAT and single quotes are not encoded; side b is PHP 8.1
  or newer, where the default is ENT_QUOTES | ENT_SUBSTITUTE
symptoms:
  - text: "a single quote is encoded as &#039; and malformed UTF-8 is replaced with a substitution character"
    basis: verified
mechanism: >-
  PHP 8.1 changes the default flags of htmlspecialchars(), htmlentities() and related functions from ENT_COMPAT
  to ENT_QUOTES | ENT_SUBSTITUTE.
detect:
  all:
    - a: tool.php.version
      ver: '<8.1.0'
    - b: tool.php.version
      ver: '>=8.1.0'
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration81.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: Standard
fixtures:
  positive:
    - name: php 8.0.30 to php 8.1.34
      a:
        attrs:
          tool.php.version: '8.0.30'
      b:
        attrs:
          tool.php.version: '8.1.34'
  negative:
    - name: php 8.1.34 to php 8.0.30 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.0.30'
    - name: php 8.1.34 to php 8.4.26 (both sides on or after 8.1)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
