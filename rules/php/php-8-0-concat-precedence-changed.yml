schema: 1
id: php-8-0-concat-precedence-changed
title: PHP 8.0 gives + and - higher precedence than the concatenation operator
applies:
  - runtime
difference: >-
  side a is PHP below 8.0; side b is PHP 8.0 or newer, where + and - bind tighter than the . operator; explicit
  parentheses make the expression independent of the change
symptoms:
  - text: 'echo "Sum: " . $a + $b; prints "Sum: " followed by $a + $b on PHP 8.0 and later, where PHP 7.x evaluated ("Sum: " . $a) + $b'
    basis: verified
mechanism: >-
  From PHP 8.0 the concatenation operator has lower precedence than addition, subtraction and bitshifts, so an
  unparenthesised sum in a concatenation is evaluated before the concatenation.
detect:
  all:
    - a: tool.php.version
      ver: '<8.0.0'
    - b: tool.php.version
      ver: '>=8.0.0'
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration80.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
fixtures:
  positive:
    - name: php 7.4.33 to php 8.4.26
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '8.4.26'
  negative:
    - name: php 8.4.26 to php 7.4.33 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.4.26'
      b:
        attrs:
          tool.php.version: '7.4.33'
    - name: php 8.1.34 to php 8.4.26 (both sides on or after 8.0)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
