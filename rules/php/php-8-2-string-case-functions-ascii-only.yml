schema: 1
id: php-8-2-string-case-functions-ascii-only
title: PHP 8.2 makes strtolower(), strtoupper() and related functions ignore the locale
applies:
  - runtime
  - locale
difference: >-
  side a is PHP 8.1 or older, where the case functions follow LC_CTYPE set by setlocale(); side b is PHP 8.2
  or newer, where they convert ASCII only; setlocale() is not observable from the environment, so the
  env.LC_CTYPE check is a proxy
symptoms:
  - text: case-folded output changes for non-ASCII letters when the program has set a non-C LC_CTYPE locale
    basis: inferred
mechanism: >-
  From PHP 8.2 strtolower(), strtoupper(), stristr(), stripos(), strripos(), lcfirst(), ucfirst(), ucwords() and
  str_ireplace() ignore the locale and convert ASCII case only, as if the locale were C.
detect:
  all:
    - a: tool.php.version
      ver: '<8.2.0'
    - b: tool.php.version
      ver: '>=8.2.0'
    - a: env.LC_CTYPE
      ne: C
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration82.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: Standard
fixtures:
  positive:
    - name: php 8.1.34 with tr_TR locale to php 8.2.28
      a:
        attrs:
          tool.php.version: '8.1.34'
          env.LC_CTYPE: tr_TR.UTF-8
      b:
        attrs:
          tool.php.version: '8.2.28'
          env.LC_CTYPE: tr_TR.UTF-8
  negative:
    - name: php 8.2.28 to php 8.1.34 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.2.28'
          env.LC_CTYPE: tr_TR.UTF-8
      b:
        attrs:
          tool.php.version: '8.1.34'
          env.LC_CTYPE: tr_TR.UTF-8
    - name: php 8.1.34 to php 8.2.28 with LC_CTYPE C on side a
      a:
        attrs:
          tool.php.version: '8.1.34'
          env.LC_CTYPE: C
      b:
        attrs:
          tool.php.version: '8.2.28'
          env.LC_CTYPE: C
status: active
