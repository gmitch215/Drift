schema: 1
id: php-8-2-dynamic-properties-deprecated
title: PHP 8.2 deprecates creating dynamic properties on classes that do not declare them
applies:
  - runtime
difference: >-
  side a is PHP 8.1 or older, where assigning an undeclared property is silent; side b is PHP 8.2 or newer,
  where it is deprecated unless the class opts in; stdClass allows dynamic properties, and magic __get() and
  __set() are not affected
symptoms:
  - text: a deprecation on each write to an undeclared property of a class without #[\AllowDynamicProperties]
    basis: verified
mechanism: >-
  PHP 8.2 deprecates creating dynamic properties unless the class uses the #[\AllowDynamicProperties] attribute.
detect:
  all:
    - a: tool.php.version
      ver: '<8.2.0'
    - b: tool.php.version
      ver: '>=8.2.0'
severity: medium
provenance:
  - url: https://www.php.net/manual/en/migration82.deprecated.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: Usage of dynamic properties
fixtures:
  positive:
    - name: php 8.1.34 to php 8.2.28
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.2.28'
  negative:
    - name: php 8.2.28 to php 8.1.34 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.2.28'
      b:
        attrs:
          tool.php.version: '8.1.34'
    - name: php 8.2.28 to php 8.4.26 (both sides on or after 8.2)
      a:
        attrs:
          tool.php.version: '8.2.28'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
