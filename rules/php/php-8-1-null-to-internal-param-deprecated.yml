schema: 1
id: php-8-1-null-to-internal-param-deprecated
title: PHP 8.1 deprecates passing null to non-nullable parameters of built-in functions
applies:
  - runtime
difference: >-
  side a is PHP 8.0, where null passed to a built-in scalar parameter is silent; side b is PHP 8.1 or newer,
  where it emits a deprecation; scalar parameter types of built-in functions are nullable by default
symptoms:
  - text: 'Deprecated: Passing null to parameter #2 ($needle) of type string is deprecated, as the page example shows for str_contains()'
    basis: verified
mechanism: >-
  PHP 8.1 deprecates passing null to non-nullable parameters of built-in functions, to align them with user-defined
  functions where scalar types must be marked nullable explicitly.
detect:
  all:
    - a: tool.php.version
      ver: '<8.1.0'
    - b: tool.php.version
      ver: '>=8.1.0'
severity: medium
provenance:
  - url: https://www.php.net/manual/en/migration81.deprecated.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: PHP Core
fixtures:
  positive:
    - name: php 8.0.30 to php 8.1.34
      a:
        attrs:
          tool.php.version: '8.0.30'
      b:
        attrs:
          tool.php.version: '8.1.34'
  negative:
    - name: php 8.1.34 to php 8.0.30 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.0.30'
    - name: php 8.1.34 to php 8.4.26 (both sides on or after 8.1)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
