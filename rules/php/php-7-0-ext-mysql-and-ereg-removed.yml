schema: 1
id: php-7-0-ext-mysql-and-ereg-removed
title: PHP 7.0 removes the ext/mysql and ereg* function families
applies:
  - runtime
difference: >-
  the PHP version is below 7.0 on the passing side and 7.0 or newer on the failing side
symptoms:
  - text: calls to mysql_* or ereg* functions fail as undefined functions on PHP 7.0 and later
    basis: inferred
mechanism: >-
  The PHP 7.0 migration page lists all ext/mysql functions and all ereg* functions as removed, so only code
  that calls them is affected and the version band is necessary but not sufficient.
detect:
  all:
    - a: tool.php.version
      ver: '<7.0.0'
    - b: tool.php.version
      ver: '>=7.0.0'
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration70.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: Removed functions
fixtures:
  positive:
    - name: php 5.6.40 to php 7.4.33
      a:
        attrs:
          tool.php.version: '5.6.40'
      b:
        attrs:
          tool.php.version: '7.4.33'
  negative:
    - name: php 7.4.33 to php 5.6.40 (reverse direction)
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '5.6.40'
    - name: php 7.4.33 to php 8.4.26 (both sides on or after 7.0)
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
