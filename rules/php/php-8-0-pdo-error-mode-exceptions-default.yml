schema: 1
id: php-8-0-pdo-error-mode-exceptions-default
title: PHP 8.0 changes the PDO default error mode from silent to exceptions
applies:
  - runtime
difference: >-
  side a is PHP below 8.0, where PDO's default error mode is silent; side b is PHP 8.0 or newer, where the
  default is exceptions
symptoms:
  - text: a failing PDO call throws PDOException on PHP 8.0 and later where PHP 7.x returned false
    basis: inferred
mechanism: >-
  The PHP 8.0 page states that the default error handling mode for PDO has been changed from silent to
  exceptions.
detect:
  all:
    - a: tool.php.version
      ver: '<8.0.0'
    - b: tool.php.version
      ver: '>=8.0.0'
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration80.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
fixtures:
  positive:
    - name: php 7.4.33 to php 8.4.26
      a:
        attrs:
          tool.php.version: '7.4.33'
      b:
        attrs:
          tool.php.version: '8.4.26'
  negative:
    - name: php 8.4.26 to php 7.4.33 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.4.26'
      b:
        attrs:
          tool.php.version: '7.4.33'
    - name: php 8.1.34 to php 8.4.26 (both sides on or after 8.0)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
