schema: 1
id: php-8-1-mysqli-error-mode-exceptions-default
title: PHP 8.1 changes the mysqli default error mode from silent to exceptions
applies:
  - runtime
difference: >-
  side a is PHP 8.0 or older, where mysqli errors are silent by default; side b is PHP 8.1 or newer, where the
  default is exceptions
symptoms:
  - text: a failing mysqli call throws an exception on PHP 8.1 and later where the old code checked return values
    basis: inferred
mechanism: >-
  The PHP 8.1 page states that the default mysqli error handling mode has been changed from silent to
  exceptions, and refers to the MySQLi reporting mode page for restoring the old behaviour.
detect:
  all:
    - a: tool.php.version
      ver: '<8.1.0'
    - b: tool.php.version
      ver: '>=8.1.0'
severity: high
provenance:
  - url: https://www.php.net/manual/en/migration81.incompatible.php
    kind: vendor-doc
    verified: '2026-10-13'
    section: MySQLi
fixtures:
  positive:
    - name: php 8.0.30 to php 8.1.34
      a:
        attrs:
          tool.php.version: '8.0.30'
      b:
        attrs:
          tool.php.version: '8.1.34'
  negative:
    - name: php 8.1.34 to php 8.0.30 (reverse direction)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.0.30'
    - name: php 8.1.34 to php 8.4.26 (both sides on or after 8.1)
      a:
        attrs:
          tool.php.version: '8.1.34'
      b:
        attrs:
          tool.php.version: '8.4.26'
status: active
