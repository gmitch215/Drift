schema: 1
id: prisma-7-node-20-19-minimum
title: Prisma 7 declares engines.node ^20.19 || ^22.12 || >=24.0, so a Node version outside that range is unsupported
applies:
  - runtime
  - build
difference: >-
  side a is a Node version inside the engines range of Prisma 7 and side b is a Node version outside it, with the same Prisma 7 release on side b
symptoms:
  - text: 'npm reports EBADENGINE for prisma on the unsupported Node version, and the package may fail to start'
    basis: inferred
mechanism: >-
  The registry document of prisma 7.0.1 declares engines.node ^20.19 || ^22.12 || >=24.0, so a Node version outside that range is unsupported by Prisma 7.
detect:
  all:
    - a: tool.node.version
      ver:
        - '>=20.19.0,<21.0.0'
        - '>=22.12.0,<23.0.0'
        - '>=24.0.0'
    - b: tool.node.version
      ver:
        - '<20.19.0'
        - '>=21.0.0,<22.12.0'
        - '>=23.0.0,<24.0.0'
    - any:
        - b: project.npm.@prisma/client
          ver: '>=7.0.1'
        - b: project.npm.prisma
          ver: '>=7.0.1'
severity: medium
provenance:
  - url: https://registry.npmjs.org/prisma/7.0.1
    kind: vendor-doc
    verified: '2026-10-15'
    section: 'engines of prisma 7.0.1: "engines":{"node":"^20.19 || ^22.12 || >=24.0"}'
fixtures:
  positive:
    - name: 'Prisma 7 on node 22.12.0 to node 20.11.1'
      a:
        attrs:
          tool.node.version: '22.12.0'
      b:
        attrs:
          tool.node.version: '20.11.1'
          project.npm.@prisma/client: '7.0.1'
  negative:
    - name: 'prisma 6.19.0 is below the first release with this range'
      a:
        attrs:
          tool.node.version: '22.12.0'
      b:
        attrs:
          tool.node.version: '20.11.1'
          project.npm.@prisma/client: '6.19.0'
    - name: 'node 22.12.0 is inside the range on both sides'
      a:
        attrs:
          tool.node.version: '22.12.0'
      b:
        attrs:
          tool.node.version: '22.12.0'
          project.npm.@prisma/client: '7.0.1'
status: active
