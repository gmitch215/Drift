schema: 1
id: gcc-15-c23-default-gnu23
title: GCC 15 defaults C to gnu23, so C idioms that use C23 keywords or empty parameter lists change
applies:
  - compiler
difference: >-
  the C compiler is GCC 15 or newer on the failing side (default -std=gnu23) and GCC 14 or older on
  the passing side (default -std=gnu17); the difference applies only when the project sets no -std
  flag, so the rule reads the project's C standard flag
symptoms:
  - text: >-
      a project that defines bool, true, false, nullptr or thread_local as identifiers fails to
      compile (the page gives typedef int bool; as an error)
    basis: verified
  - text: >-
      a function declared as rettype f(); means f(void) in C23, so calls that pass arguments fail
    basis: inferred
mechanism: >-
  GCC 15 changes the default C language version to C23 (gnu23), which makes bool, true, false,
  nullptr and thread_local keywords and changes the meaning of empty parameter lists.
detect:
  all:
    - a: tool.cc.family
      eq: gcc
    - b: tool.cc.family
      eq: gcc
    - a: tool.cc.version
      ver: '<15'
    - b: tool.cc.version
      ver: '>=15'
    - b: project.build.c.std-flag
      present: 'false'
severity: medium
provenance:
  - url: https://gcc.gnu.org/gcc-15/porting_to.html
    kind: release-note
    verified: '2026-10-13'
    section: 'C23 by default'
fixtures:
  positive:
    - name: gcc 14.2.0 to gcc 15.1.0 with no -std flag
      a:
        attrs:
          tool.cc.family: gcc
          tool.cc.version: '14.2.0'
      b:
        attrs:
          tool.cc.family: gcc
          tool.cc.version: '15.1.0'
  negative:
    - name: gcc 14.2.0 to gcc 15.1.0 with -std=gnu17 set
      a:
        attrs:
          tool.cc.family: gcc
          tool.cc.version: '14.2.0'
      b:
        attrs:
          tool.cc.family: gcc
          tool.cc.version: '15.1.0'
          project.build.c.std-flag: '-std=gnu17'
    - name: gcc 15.1.0 to gcc 15.2.0 with no -std flag
      a:
        attrs:
          tool.cc.family: gcc
          tool.cc.version: '15.1.0'
      b:
        attrs:
          tool.cc.family: gcc
          tool.cc.version: '15.2.0'
status: pending-scanner
