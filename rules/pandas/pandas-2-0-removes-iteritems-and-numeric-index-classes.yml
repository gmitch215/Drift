schema: 1
id: pandas-2-0-removes-iteritems-and-numeric-index-classes
title: pandas 2.0 removes iteritems, Int64Index, UInt64Index and Float64Index, so code that still uses them fails
applies:
  - runtime
difference: >-
  side a is pandas 1.x; side b is pandas 2.x with source that still uses the removed names
symptoms:
  - text: 'AttributeError: ''DataFrame'' object has no attribute ''iteritems'''
    basis: verified
mechanism: The 2.0.0 whatsnew lists these under Removal of prior version deprecations/changes.
detect:
  all:
    - a: project.python.pandas
      ver: '>=1,<2'
    - b: project.python.pandas
      ver: '>=2'
    - b: project.pandas.source.removed-2-0-members
      present: 'true'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/pandas-dev/pandas/v2.0.0/doc/source/whatsnew/v2.0.0.rst
    kind: release-note
    verified: '2026-10-15'
    section: 'Removal of prior version deprecations/changes'
fixtures:
  positive:
    - name: pandas 1.5.3 to pandas 2.0.3 with the removed names in the source
      a: {attrs: {project.python.pandas: '1.5.3'}}
      b: {attrs: {project.python.pandas: '2.0.3', project.pandas.source.removed-2-0-members: 'true'}}
  negative:
    - name: pandas 2.0.3 to pandas 1.5.3 with the removed names in the source (reverse direction)
      a: {attrs: {project.python.pandas: '2.0.3', project.pandas.source.removed-2-0-members: 'true'}}
      b: {attrs: {project.python.pandas: '1.5.3'}}
    - name: pandas 1.5.3 to pandas 2.0.3 without the removed names in the source
      a: {attrs: {project.python.pandas: '1.5.3'}}
      b: {attrs: {project.python.pandas: '2.0.3'}}
    - name: pandas 1.5.3 to pandas 1.5.3 with the removed names in the source (no version move)
      a: {attrs: {project.python.pandas: '1.5.3'}}
      b: {attrs: {project.python.pandas: '1.5.3', project.pandas.source.removed-2-0-members: 'true'}}
status: active
