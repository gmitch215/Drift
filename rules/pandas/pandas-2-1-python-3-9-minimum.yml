schema: 1
id: pandas-2-1-python-3-9-minimum
title: pandas 2.1 to 2.3 requires Python 3.9 or newer, so a Python below 3.9 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.9 or newer with pandas 2.1 to 2.3; side b is Python below 3.9 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for pandas==2.1.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for pandas 2.1.0 gives requires_python ">=3.9" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.9'
    - b: tool.python.version
      ver: '<3.9'
    - a: project.python.pandas
      ver: '>=2.1,<3'
    - b: project.python.pandas
      ver: '>=2.1,<3'
severity: high
provenance:
  - url: https://pypi.org/pypi/pandas/2.1.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.11.9 to python 3.8.18 with pandas 2.2.3
      a: {attrs: {tool.python.version: '3.11.9', project.python.pandas: '2.2.3'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.pandas: '2.2.3'}}
  negative:
    - name: python 3.8.18 to python 3.11.9 with pandas 2.2.3 (reverse direction)
      a: {attrs: {tool.python.version: '3.8.18', project.python.pandas: '2.2.3'}}
      b: {attrs: {tool.python.version: '3.11.9', project.python.pandas: '2.2.3'}}
    - name: python 3.11.9 to python 3.8.18 with pandas 2.0.3 (outside the release line)
      a: {attrs: {tool.python.version: '3.11.9', project.python.pandas: '2.0.3'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.pandas: '2.0.3'}}
    - name: python 3.8.18 to python 3.8.18 with pandas 2.2.3 (same band)
      a: {attrs: {tool.python.version: '3.8.18', project.python.pandas: '2.2.3'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.pandas: '2.2.3'}}
status: active
