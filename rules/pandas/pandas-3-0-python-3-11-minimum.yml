schema: 1
id: pandas-3-0-python-3-11-minimum
title: pandas 3.x requires Python 3.11 or newer, so a Python below 3.11 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.11 or newer with pandas 3.x; side b is Python below 3.11 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for pandas==3.0.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for pandas 3.0.0 gives requires_python ">=3.11" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.11'
    - b: tool.python.version
      ver: '<3.11'
    - a: project.python.pandas
      ver: '>=3,<4'
    - b: project.python.pandas
      ver: '>=3,<4'
severity: high
provenance:
  - url: https://pypi.org/pypi/pandas/3.0.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.13.1 to python 3.10.14 with pandas 3.0.0
      a: {attrs: {tool.python.version: '3.13.1', project.python.pandas: '3.0.0'}}
      b: {attrs: {tool.python.version: '3.10.14', project.python.pandas: '3.0.0'}}
  negative:
    - name: python 3.10.14 to python 3.13.1 with pandas 3.0.0 (reverse direction)
      a: {attrs: {tool.python.version: '3.10.14', project.python.pandas: '3.0.0'}}
      b: {attrs: {tool.python.version: '3.13.1', project.python.pandas: '3.0.0'}}
    - name: python 3.13.1 to python 3.10.14 with pandas 2.3.3 (outside the release line)
      a: {attrs: {tool.python.version: '3.13.1', project.python.pandas: '2.3.3'}}
      b: {attrs: {tool.python.version: '3.10.14', project.python.pandas: '2.3.3'}}
    - name: python 3.10.14 to python 3.10.14 with pandas 3.0.0 (same band)
      a: {attrs: {tool.python.version: '3.10.14', project.python.pandas: '3.0.0'}}
      b: {attrs: {tool.python.version: '3.10.14', project.python.pandas: '3.0.0'}}
status: active
