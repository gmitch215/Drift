schema: 1
id: flask-3-1-python-3-9-minimum
title: Flask 3.1 and newer requires Python 3.9 or newer, so a Python below 3.9 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.9 or newer with Flask 3.1 and newer; side b is Python below 3.9 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for flask==3.1.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for flask 3.1.0 gives requires_python ">=3.9" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.9'
    - b: tool.python.version
      ver: '<3.9'
    - a: project.python.flask
      ver: '>=3.1'
    - b: project.python.flask
      ver: '>=3.1'
severity: high
provenance:
  - url: https://pypi.org/pypi/flask/3.1.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.11.9 to python 3.8.18 with flask 3.1.2
      a: {attrs: {tool.python.version: '3.11.9', project.python.flask: '3.1.2'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.flask: '3.1.2'}}
  negative:
    - name: python 3.8.18 to python 3.11.9 with flask 3.1.2 (reverse direction)
      a: {attrs: {tool.python.version: '3.8.18', project.python.flask: '3.1.2'}}
      b: {attrs: {tool.python.version: '3.11.9', project.python.flask: '3.1.2'}}
    - name: python 3.11.9 to python 3.8.18 with flask 3.0.3 (outside the release line)
      a: {attrs: {tool.python.version: '3.11.9', project.python.flask: '3.0.3'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.flask: '3.0.3'}}
    - name: python 3.8.18 to python 3.8.18 with flask 3.1.2 (same band)
      a: {attrs: {tool.python.version: '3.8.18', project.python.flask: '3.1.2'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.flask: '3.1.2'}}
status: active
