schema: 1
id: numpy-2-3-python-3-11-minimum
title: NumPy 2.3 and 2.4 requires Python 3.11 or newer, so a Python below 3.11 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.11 or newer with NumPy 2.3 and 2.4; side b is Python below 3.11 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for numpy==2.3.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for numpy 2.3.0 gives requires_python ">=3.11" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.11'
    - b: tool.python.version
      ver: '<3.11'
    - a: project.python.numpy
      ver: '>=2.3,<2.5'
    - b: project.python.numpy
      ver: '>=2.3,<2.5'
severity: high
provenance:
  - url: https://pypi.org/pypi/numpy/2.3.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.13.1 to python 3.10.14 with numpy 2.3.2
      a: {attrs: {tool.python.version: '3.13.1', project.python.numpy: '2.3.2'}}
      b: {attrs: {tool.python.version: '3.10.14', project.python.numpy: '2.3.2'}}
  negative:
    - name: python 3.10.14 to python 3.13.1 with numpy 2.3.2 (reverse direction)
      a: {attrs: {tool.python.version: '3.10.14', project.python.numpy: '2.3.2'}}
      b: {attrs: {tool.python.version: '3.13.1', project.python.numpy: '2.3.2'}}
    - name: python 3.13.1 to python 3.10.14 with numpy 2.2.6 (outside the release line)
      a: {attrs: {tool.python.version: '3.13.1', project.python.numpy: '2.2.6'}}
      b: {attrs: {tool.python.version: '3.10.14', project.python.numpy: '2.2.6'}}
    - name: python 3.10.14 to python 3.10.14 with numpy 2.3.2 (same band)
      a: {attrs: {tool.python.version: '3.10.14', project.python.numpy: '2.3.2'}}
      b: {attrs: {tool.python.version: '3.10.14', project.python.numpy: '2.3.2'}}
status: active
