schema: 1
id: numpy-2-5-python-3-12-minimum
title: NumPy 2.5 requires Python 3.12 or newer, so a Python below 3.12 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.12 or newer with NumPy 2.5; side b is Python below 3.12 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for numpy==2.5.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for numpy 2.5.0 gives requires_python ">=3.12" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.12'
    - b: tool.python.version
      ver: '<3.12'
    - a: project.python.numpy
      ver: '>=2.5,<3'
    - b: project.python.numpy
      ver: '>=2.5,<3'
severity: high
provenance:
  - url: https://pypi.org/pypi/numpy/2.5.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.13.1 to python 3.11.9 with numpy 2.5.0
      a: {attrs: {tool.python.version: '3.13.1', project.python.numpy: '2.5.0'}}
      b: {attrs: {tool.python.version: '3.11.9', project.python.numpy: '2.5.0'}}
  negative:
    - name: python 3.11.9 to python 3.13.1 with numpy 2.5.0 (reverse direction)
      a: {attrs: {tool.python.version: '3.11.9', project.python.numpy: '2.5.0'}}
      b: {attrs: {tool.python.version: '3.13.1', project.python.numpy: '2.5.0'}}
    - name: python 3.13.1 to python 3.11.9 with numpy 2.4.1 (outside the release line)
      a: {attrs: {tool.python.version: '3.13.1', project.python.numpy: '2.4.1'}}
      b: {attrs: {tool.python.version: '3.11.9', project.python.numpy: '2.4.1'}}
    - name: python 3.11.9 to python 3.11.9 with numpy 2.5.0 (same band)
      a: {attrs: {tool.python.version: '3.11.9', project.python.numpy: '2.5.0'}}
      b: {attrs: {tool.python.version: '3.11.9', project.python.numpy: '2.5.0'}}
status: active
