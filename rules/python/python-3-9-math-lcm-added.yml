schema: 1
id: python-3-9-math-lcm-added
title: Python 3.9 adds math.lcm
applies:
  - runtime
difference: >-
  the Python version is 3.9 or newer on the passing side and older than 3.9 on the failing side
symptoms:
  - text: "AttributeError: module 'math' has no attribute 'lcm'"
    basis: inferred
mechanism: Python 3.9 adds the math.lcm function, so a call to it fails on earlier Python versions.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.9.0'
    - b: tool.python.version
      ver: '<3.9.0'
    - b: project.python.calls.math.lcm
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3/library/math.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: "lcm(*integers): Added in version 3.9"
fixtures:
  positive:
    - name: "python 3.8.18 target using math.lcm (3.13.1 to 3.8.18)"
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.8.18'
          project.python.calls.math.lcm: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.8.18'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.13.1'
          project.python.calls.math.lcm: 'true'
status: active
