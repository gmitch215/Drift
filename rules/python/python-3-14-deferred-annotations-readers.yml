schema: 1
id: python-3-14-deferred-annotations-readers
title: Python 3.14 defers evaluation of annotations, so code that reads __annotations__ may need changes
applies:
  - runtime
difference: the failing side is Python 3.14, where annotations are evaluated lazily under PEP 649 and PEP 749; on 3.13 and older they are evaluated when the definition runs
symptoms:
  - text: readers of __annotations__ may see deferred or forward-reference values instead of evaluated objects
    basis: inferred
mechanism: Python 3.14 defers evaluation of function, class and module annotations under PEP 649 and PEP 749, so code that reads __annotations__ directly may need changes.
detect:
  all:
    - a: tool.python.version
      ver: '<3.14'
    - b: tool.python.version
      ver: '>=3.14'
    - b: project.python.calls.annotation-readers
      present: 'true'
severity: low
provenance:
  - url: https://docs.python.org/3.14/whatsnew/3.14.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Implications for readers of __annotations__'
fixtures:
  positive:
    - name: python 3.13.9 to python 3.14.0 reading __annotations__
      a:
        attrs:
          tool.python.version: '3.13.9'
      b:
        attrs:
          tool.python.version: '3.14.0'
          project.python.calls.annotation-readers: 'true'
  negative:
    - name: python 3.13.9 to python 3.14.0 with no annotation reader
      a:
        attrs:
          tool.python.version: '3.13.9'
      b:
        attrs:
          tool.python.version: '3.14.0'
    - name: python 3.14.0 to python 3.14.1 reading __annotations__ (both sides past 3.14)
      a:
        attrs:
          tool.python.version: '3.14.0'
          project.python.calls.annotation-readers: 'true'
      b:
        attrs:
          tool.python.version: '3.14.1'
          project.python.calls.annotation-readers: 'true'
status: active
