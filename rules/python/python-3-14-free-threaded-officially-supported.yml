schema: 1
id: python-3-14-free-threaded-officially-supported
title: Python 3.14 officially supports the free-threaded build as an optional build
applies:
  - runtime
difference: the default GIL build of Python 3.14 on the passing side and the free-threaded 3.14 build on the failing side
symptoms:
  - text: code that runs on the free-threaded build sees GIL-disabled threading behaviour
    basis: inferred
mechanism: Python 3.14 makes the free-threaded build officially supported under PEP 779 while keeping it an optional build separate from the default build.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.14,<3.15'
    - b: tool.python.version
      ver: '>=3.14,<3.15'
    - a: tool.python.gil-disabled
      eq: 'false'
    - b: tool.python.gil-disabled
      eq: 'true'
severity: medium
provenance:
  - url: https://peps.python.org/pep-0779/
    kind: spec
    verified: '2026-10-13'
    section: Abstract
  - url: https://docs.python.org/3.14/whatsnew/3.14.html
    kind: release-note
    verified: '2026-10-13'
    section: PEP 779 entry in the release summary
fixtures:
  positive:
    - name: python 3.14.0 default build to free-threaded build
      a:
        attrs:
          tool.python.version: '3.14.0'
          tool.python.gil-disabled: 'false'
      b:
        attrs:
          tool.python.version: '3.14.0'
          tool.python.gil-disabled: 'true'
  negative:
    - name: both default builds
      a:
        attrs:
          tool.python.version: '3.14.0'
          tool.python.gil-disabled: 'false'
      b:
        attrs:
          tool.python.version: '3.14.0'
          tool.python.gil-disabled: 'false'
    - name: free-threaded build on 3.13 is outside the 3.14 band
      a:
        attrs:
          tool.python.version: '3.13.16'
          tool.python.gil-disabled: 'false'
      b:
        attrs:
          tool.python.version: '3.13.16'
          tool.python.gil-disabled: 'true'
    - name: free-threaded flag not captured on the failing side
      a:
        attrs:
          tool.python.version: '3.14.0'
          tool.python.gil-disabled: 'false'
      b:
        attrs:
          tool.python.version: '3.14.0'
status: active
