schema: 1
id: python-3-9-str-removeprefix-added
title: Python 3.9 adds str.removeprefix
applies:
  - runtime
difference: >-
  the Python version is 3.9 or newer on the passing side and older than 3.9 on the failing side
symptoms:
  - text: "AttributeError: 'str' object has no attribute 'removeprefix'"
    basis: inferred
mechanism: Python 3.9 adds the str.removeprefix method, so a call to it fails on earlier Python versions.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.9.0'
    - b: tool.python.version
      ver: '<3.9.0'
    - b: project.python.calls.str.removeprefix
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3/library/stdtypes.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: "str.removeprefix(prefix, /): Added in version 3.9"
fixtures:
  positive:
    - name: "python 3.8.18 target using str.removeprefix (3.13.1 to 3.8.18)"
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.8.18'
          project.python.calls.str.removeprefix: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.8.18'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.13.1'
          project.python.calls.str.removeprefix: 'true'
status: active
