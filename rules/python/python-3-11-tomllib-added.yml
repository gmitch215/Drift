schema: 1
id: python-3-11-tomllib-added
title: Python 3.11 adds the tomllib module
applies:
  - runtime
difference: >-
  the Python version is 3.11 or newer on the passing side and older than 3.11 on the failing side
symptoms:
  - text: "ModuleNotFoundError: No module named 'tomllib'"
    basis: inferred
mechanism: Python 3.11 adds the tomllib module, so an import of it fails on earlier Python versions.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.11.0'
    - b: tool.python.version
      ver: '<3.11.0'
    - b: project.python.imports.tomllib
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3/library/tomllib.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: "Added in version 3.11: The module was added"
fixtures:
  positive:
    - name: "python 3.10.14 target using tomllib (3.13.1 to 3.10.14)"
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.10.14'
          project.python.imports.tomllib: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.10.14'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.13.1'
          project.python.imports.tomllib: 'true'
status: active
