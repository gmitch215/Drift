schema: 1
id: python-3-12-typing-override-added
title: Python 3.12 adds typing.override
applies:
  - runtime
difference: >-
  the Python version is 3.12 or newer on the passing side and older than 3.12 on the failing side
symptoms:
  - text: "ImportError: cannot import name 'override' from 'typing'"
    basis: inferred
mechanism: Python 3.12 adds the typing.override decorator, so a use of it fails on earlier Python versions.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.12.0'
    - b: tool.python.version
      ver: '<3.12.0'
    - b: project.python.calls.typing.override
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3/library/typing.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: "@typing.override: Added in version 3.12"
fixtures:
  positive:
    - name: "python 3.11.9 target using typing.override (3.13.1 to 3.11.9)"
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.11.9'
          project.python.calls.typing.override: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.11.9'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.13.1'
          project.python.calls.typing.override: 'true'
status: active
