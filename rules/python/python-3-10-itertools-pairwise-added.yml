schema: 1
id: python-3-10-itertools-pairwise-added
title: Python 3.10 adds itertools.pairwise
applies:
  - runtime
difference: >-
  the Python version is 3.10 or newer on the passing side and older than 3.10 on the failing side
symptoms:
  - text: "AttributeError: module 'itertools' has no attribute 'pairwise'"
    basis: inferred
mechanism: Python 3.10 adds itertools.pairwise, so a call to it fails on earlier Python versions.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.10.0'
    - b: tool.python.version
      ver: '<3.10.0'
    - b: project.python.calls.itertools.pairwise
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3/library/itertools.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: "itertools.pairwise(iterable): Added in version 3.10"
fixtures:
  positive:
    - name: "python 3.9.19 target using itertools.pairwise (3.13.1 to 3.9.19)"
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.9.19'
          project.python.calls.itertools.pairwise: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.9.19'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.python.version: '3.13.1'
      b:
        attrs:
          tool.python.version: '3.13.1'
          project.python.calls.itertools.pairwise: 'true'
status: active
