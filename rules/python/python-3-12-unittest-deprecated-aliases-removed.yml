schema: 1
id: python-3-12-unittest-deprecated-aliases-removed
title: Python 3.12 removes long-deprecated unittest.TestCase method aliases such as assertEquals
applies:
  - runtime
difference: the failing side is Python 3.12, where the aliases are gone; on 3.11 and older they still run
symptoms:
  - text: AttributeError on the alias name, for example assertEquals, in the test suite
    basis: inferred
mechanism: Python 3.12 removes many long-deprecated unittest.TestCase method aliases, for example assertEquals, which is replaced by assertEqual.
detect:
  all:
    - a: tool.python.version
      ver: '<3.12'
    - b: tool.python.version
      ver: '>=3.12'
    - b: project.python.calls.unittest-deprecated-aliases
      present: 'true'
severity: high
provenance:
  - url: https://docs.python.org/3.12/whatsnew/3.12.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Removed > unittest'
fixtures:
  positive:
    - name: python 3.11.9 to python 3.12.15 calling assertEquals
      a:
        attrs:
          tool.python.version: '3.11.9'
      b:
        attrs:
          tool.python.version: '3.12.15'
          project.python.calls.unittest-deprecated-aliases: 'true'
  negative:
    - name: python 3.11.9 to python 3.12.15 with no alias call
      a:
        attrs:
          tool.python.version: '3.11.9'
      b:
        attrs:
          tool.python.version: '3.12.15'
    - name: python 3.12.15 to python 3.13.16 calling assertEquals (both sides past 3.12)
      a:
        attrs:
          tool.python.version: '3.12.15'
          project.python.calls.unittest-deprecated-aliases: 'true'
      b:
        attrs:
          tool.python.version: '3.13.16'
          project.python.calls.unittest-deprecated-aliases: 'true'
status: active
