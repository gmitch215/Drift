schema: 1
id: python-3-14-ast-str-num-removed
title: Python 3.14 removes the ast.Num, ast.Str, ast.Bytes, ast.NameConstant and ast.Ellipsis aliases
applies:
  - runtime
difference: the failing side is Python 3.14, where these five deprecated aliases of ast.Constant are gone; on 3.13 they still exist with deprecation warnings
symptoms:
  - text: user visit_Num and visit_Str methods on an ast.NodeVisitor are no longer called
    basis: verified
  - text: AttributeError when code references ast.Str or ast.Num
    basis: inferred
mechanism: Python 3.14 removes the deprecated ast.Bytes, ast.Ellipsis, ast.NameConstant, ast.Num and ast.Str classes, which are aliases of ast.Constant.
detect:
  all:
    - a: tool.python.version
      ver: '<3.14'
    - b: tool.python.version
      ver: '>=3.14'
    - b: project.python.calls.ast-removed-nodes
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3.14/whatsnew/3.14.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Removed > ast'
fixtures:
  positive:
    - name: python 3.13.9 to python 3.14.0 referencing ast.Num
      a:
        attrs:
          tool.python.version: '3.13.9'
      b:
        attrs:
          tool.python.version: '3.14.0'
          project.python.calls.ast-removed-nodes: 'true'
  negative:
    - name: python 3.13.9 to python 3.14.0 with no removed ast alias
      a:
        attrs:
          tool.python.version: '3.13.9'
      b:
        attrs:
          tool.python.version: '3.14.0'
    - name: python 3.14.0 to python 3.14.1 referencing ast.Num (both sides past 3.14)
      a:
        attrs:
          tool.python.version: '3.14.0'
          project.python.calls.ast-removed-nodes: 'true'
      b:
        attrs:
          tool.python.version: '3.14.1'
          project.python.calls.ast-removed-nodes: 'true'
status: active
