schema: 1
id: python-3-12-itertools-batched-added
title: Python 3.12 adds itertools.batched
applies:
  - runtime
difference: >-
  the Python version is 3.12 or newer on the passing side and older than 3.12 on the failing side
symptoms:
  - text: "AttributeError: module 'itertools' has no attribute 'batched'"
    basis: inferred
mechanism: Python 3.12 adds itertools.batched, so a call to it fails on earlier Python versions.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.12.0'
    - b: tool.python.version
      ver: '<3.12.0'
    - b: project.python.calls.itertools.batched
      present: 'true'
severity: medium
provenance:
  - url: https://docs.python.org/3/library/itertools.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: "itertools.batched: Added in version 3.12"
fixtures:
  positive:
    - name: python 3.11 target calling itertools.batched (3.12.8 to 3.11.9)
      a:
        attrs:
          tool.python.version: '3.12.8'
      b:
        attrs:
          tool.python.version: '3.11.9'
          project.python.calls.itertools.batched: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.python.version: '3.12.8'
      b:
        attrs:
          tool.python.version: '3.11.9'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.python.version: '3.12.8'
      b:
        attrs:
          tool.python.version: '3.12.8'
          project.python.calls.itertools.batched: 'true'
status: active
