schema: 1
id: node-21-object-groupby-added
title: Node 21 adds Object.groupBy
applies:
  - runtime
difference: >-
  the Node version is 21.0.0 or newer on the passing side and older than 21.0.0 on the failing side
symptoms:
  - text: "TypeError: Object.groupBy is not a function"
    basis: inferred
mechanism: Node 21.0.0 ships Object.groupBy, so a call to it fails on earlier Node versions.
detect:
  all:
    - a: tool.node.version
      ver: '>=21.0.0'
    - b: tool.node.version
      ver: '<21.0.0'
    - b: project.js.calls.Object.groupBy
      present: 'true'
severity: medium
provenance:
  - url: https://cdn.jsdelivr.net/npm/@mdn/browser-compat-data/data.json
    kind: vendor-doc
    verified: '2026-10-13'
    section: "javascript.builtins.Object.groupBy.__compat.support.nodejs: version_added 21.0.0"
fixtures:
  positive:
    - name: node 20 target still calling Object.groupBy (21.7.3 to 20.11.1)
      a:
        attrs:
          tool.node.version: '21.7.3'
      b:
        attrs:
          tool.node.version: '20.11.1'
          project.js.calls.Object.groupBy: 'true'
  negative:
    - name: target without the call
      a:
        attrs:
          tool.node.version: '21.7.3'
      b:
        attrs:
          tool.node.version: '20.11.1'
    - name: target on a runtime that has the API
      a:
        attrs:
          tool.node.version: '21.7.3'
      b:
        attrs:
          tool.node.version: '21.7.3'
          project.js.calls.Object.groupBy: 'true'
status: active
