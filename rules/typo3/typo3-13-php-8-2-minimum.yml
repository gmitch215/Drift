schema: 1
id: typo3-13-php-8-2-minimum
title: TYPO3 13 and 14 declares PHP 8.2 or higher, so a PHP below 8.2 host cannot install it
applies:
  - build
difference: >-
  side a is PHP 8.2 or higher with TYPO3 13 and 14; side b is PHP below 8.2 with the same release line
symptoms:
  - text: 'typo3/cms-core[v13.0.0, ..., v13.4.36] require php ^8.2 -> your php version (8.1.27) does not satisfy that requirement'
    basis: verified
mechanism: The composer.json of TYPO3 13 and 14 at tag v13.0.0 requires php ^8.2.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.2'
    - b: tool.php.version
      ver: '<8.2'
    - a: project.composer.typo3/cms-core
      ver: '>=13,<15'
    - b: project.composer.typo3/cms-core
      ver: '>=13,<15'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/TYPO3/typo3/v13.0.0/typo3/sysext/core/composer.json
    kind: spec
    verified: '2026-10-15'
    section: 'require.php'
fixtures:
  positive:
    - name: php 8.4.1 to php 8.1.27 with typo3/cms-core 13.4.0
      a: {attrs: {tool.php.version: '8.4.1', project.composer.typo3/cms-core: '13.4.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.typo3/cms-core: '13.4.0'}}
  negative:
    - name: php 8.1.27 to php 8.4.1 with typo3/cms-core 13.4.0 (reverse direction)
      a: {attrs: {tool.php.version: '8.1.27', project.composer.typo3/cms-core: '13.4.0'}}
      b: {attrs: {tool.php.version: '8.4.1', project.composer.typo3/cms-core: '13.4.0'}}
    - name: php 8.4.1 to php 8.1.27 with typo3/cms-core 12.4.20 (outside the release line)
      a: {attrs: {tool.php.version: '8.4.1', project.composer.typo3/cms-core: '12.4.20'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.typo3/cms-core: '12.4.20'}}
    - name: php 8.1.27 to php 8.1.27 with typo3/cms-core 13.4.0 (same band)
      a: {attrs: {tool.php.version: '8.1.27', project.composer.typo3/cms-core: '13.4.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.typo3/cms-core: '13.4.0'}}
status: active
