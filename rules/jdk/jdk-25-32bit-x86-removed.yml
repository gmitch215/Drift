schema: 1
id: jdk-25-32bit-x86-removed
title: JDK 25 removes the 32-bit x86 port that JDK 24 deprecated
applies:
  - os
  - kernel
  - cpu
difference: >-
  the JDK is 25 or newer on a 32-bit x86 host on the failing side and older on the passing side; the
  passing side ran a JDK 24 build on the same host
symptoms:
  - text: no JDK 25 build is published for a 32-bit x86 host, so installing or launching JDK 25 there fails
    basis: inferred
mechanism: JEP 501 deprecates the 32-bit x86 port in JDK 24, and JEP 503 removes its source and build support in JDK 25.
detect:
  all:
    - a: tool.java.version
      ver: '<25'
    - b: tool.java.version
      ver: '>=25'
    - b: os.arch
      in:
        - x86
        - i386
        - i686
severity: medium
provenance:
  - url: https://openjdk.org/jeps/503
    kind: spec
    verified: '2026-10-13'
    section: Summary
  - url: https://openjdk.org/jeps/501
    kind: spec
    verified: '2026-10-13'
    section: Summary
fixtures:
  positive:
    - name: temurin 24 to temurin 25 on i686
      a:
        attrs:
          tool.java.version: '24.0.2'
          os.arch: i686
      b:
        attrs:
          tool.java.version: '25.0.1'
          os.arch: i686
  negative:
    - name: temurin 24 to temurin 25 on x86_64
      a:
        attrs:
          tool.java.version: '24.0.2'
          os.arch: x86_64
      b:
        attrs:
          tool.java.version: '25.0.1'
          os.arch: x86_64
    - name: temurin 25.0.1 to 25.0.2 on i686 (both 25)
      a:
        attrs:
          tool.java.version: '25.0.1'
          os.arch: i686
      b:
        attrs:
          tool.java.version: '25.0.2'
          os.arch: i686
status: active
