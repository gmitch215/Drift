schema: 1
id: jdk-20-cldr-42-space-before-ampm
title: JDK 20 changes the space before AM/PM in time formats, so text from older JDKs can stop matching
applies:
  - runtime
  - locale
difference: >-
  the JDK is 20 or newer on the passing side and 19 or older on the failing side; the change shows only in
  time formats that put a space before the AM/PM marker
symptoms:
  - text: >-
      a handcrafted date-time string with a regular space may fail to parse, because the parser now expects
      a no-break space
    basis: verified
  - text: >-
      tests that compare formatted times with a golden string may fail, because the expected and actual
      strings look alike
    basis: verified
mechanism: JDK 20 upgrades to CLDR 42, which replaces the regular space in time formats with a no-break space.
detect:
  all:
    - a: tool.java.version
      ver: '>=20'
    - b: tool.java.version
      ver: '<20'
severity: medium
provenance:
  - url: https://inside.java/2024/03/29/quality-heads-up/
    kind: release-note
    verified: '2026-10-13'
    section: JDK 20 - Support for Unicode CLDR Version 42
fixtures:
  positive:
    - name: temurin 21 against temurin 17
      a:
        attrs:
          tool.java.version: '21.0.12.1'
      b:
        attrs:
          tool.java.version: '17.0.11+9'
  negative:
    - name: temurin 21 against temurin 25
      a:
        attrs:
          tool.java.version: '21.0.12.1'
      b:
        attrs:
          tool.java.version: '25.0.4.1'
    - name: temurin 17 against temurin 8
      a:
        attrs:
          tool.java.version: '17.0.11+9'
      b:
        attrs:
          tool.java.version: '1.8.0_412'
status: active
