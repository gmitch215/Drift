schema: 1
id: jdk-9-rt-jar-tools-jar-removed
title: JDK 9 replaces rt.jar and tools.jar and drops the jre directory
applies:
  - runtime
  - build
difference: >-
  the JDK is 9 or newer on the failing side; tooling that reads lib/rt.jar or lib/tools.jar from the JDK
  home works on the passing side only
symptoms:
  - text: code that assumes the jre subdirectory of a JDK image exists might not work correctly
    basis: verified
  - text: a tool that looks for tools.jar or rt.jar in the JDK home fails to find it
    basis: inferred
mechanism: JEP 220 stores classes in a runtime image, so JDK and JRE images no longer contain rt.jar or tools.jar, the jre subdirectory is gone, and the endorsed-standards override is removed.
detect:
  all:
    - a: tool.java.version
      ver: '<9'
    - b: tool.java.version
      ver: '>=9'
    - a: runtime.java-home.tools-jar
      present: 'true'
severity: high
provenance:
  - url: https://openjdk.org/jeps/220
    kind: spec
    verified: '2026-10-13'
    section: Summary
fixtures:
  positive:
    - name: temurin 8 with tools.jar to temurin 21
      a:
        attrs:
          tool.java.version: '1.8.0_504'
          runtime.java-home.tools-jar: lib/tools.jar
      b:
        attrs:
          tool.java.version: '21.0.12.1'
  negative:
    - name: temurin 8 without tools.jar to temurin 21
      a:
        attrs:
          tool.java.version: '1.8.0_504'
      b:
        attrs:
          tool.java.version: '21.0.12.1'
    - name: temurin 21 with a tools.jar key to temurin 25 (a is not before 9)
      a:
        attrs:
          tool.java.version: '21.0.12.1'
          runtime.java-home.tools-jar: lib/tools.jar
      b:
        attrs:
          tool.java.version: '25.0.4.1'
status: pending-scanner
