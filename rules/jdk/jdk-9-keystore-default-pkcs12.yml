schema: 1
id: jdk-9-keystore-default-pkcs12
title: JDK 9 creates PKCS12 keystores by default instead of JKS
applies:
  - runtime
  - build
difference: >-
  the JDK is 9 or newer on the failing side and the project keeps the default keystore type there; the
  passing side creates JKS
symptoms:
  - text: a keystore created on the failing side cannot be read by a tool or service that accepts only JKS
    basis: inferred
mechanism: JEP 229 sets PKCS12 as the default type for new keystores, while existing keystores keep their format and applications can name a type explicitly.
detect:
  all:
    - a: tool.java.version
      ver: '<9'
    - b: tool.java.version
      ver: '>=9'
    - b: project.java.keystore-type
      eq: default
severity: medium
provenance:
  - url: https://openjdk.org/jeps/229
    kind: spec
    verified: '2026-10-13'
    section: Summary
fixtures:
  positive:
    - name: temurin 8 to temurin 21 with the default keystore type
      a:
        attrs:
          tool.java.version: '1.8.0_504'
      b:
        attrs:
          tool.java.version: '21.0.12.1'
          project.java.keystore-type: default
  negative:
    - name: temurin 8 to temurin 21 with an explicit JKS keystore
      a:
        attrs:
          tool.java.version: '1.8.0_504'
      b:
        attrs:
          tool.java.version: '21.0.12.1'
          project.java.keystore-type: JKS
    - name: temurin 21 to temurin 25 with the default keystore type (a is not before 9)
      a:
        attrs:
          tool.java.version: '21.0.12.1'
      b:
        attrs:
          tool.java.version: '25.0.4.1'
          project.java.keystore-type: default
status: active
