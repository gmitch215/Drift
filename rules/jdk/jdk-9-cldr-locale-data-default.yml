schema: 1
id: jdk-9-cldr-locale-data-default
title: JDK 9 uses CLDR locale data by default, changing date, number and name formatting
applies:
  - runtime
  - locale
difference: >-
  the JDK is 9 or newer on the failing side and 8 on the passing side; formatted dates, times, numbers
  and locale names can differ for the same locale
symptoms:
  - text: >-
      formatted dates, numbers or locale display names differ from JDK 8 output in tests that compare text
    basis: inferred
mechanism: JEP 252 makes CLDR the default locale data provider, and COMPAT (the JRE provider) stays selectable through java.locale.providers.
detect:
  all:
    - a: tool.java.version
      ver: '<9'
    - b: tool.java.version
      ver: '>=9'
severity: medium
provenance:
  - url: https://openjdk.org/jeps/252
    kind: spec
    verified: '2026-10-13'
    section: Summary
fixtures:
  positive:
    - name: temurin 8 to temurin 21
      a:
        attrs:
          tool.java.version: '1.8.0_504'
      b:
        attrs:
          tool.java.version: '21.0.12.1'
  negative:
    - name: temurin 8 to temurin 8
      a:
        attrs:
          tool.java.version: '1.8.0_504'
      b:
        attrs:
          tool.java.version: '1.8.0_504'
    - name: temurin 21 to temurin 25
      a:
        attrs:
          tool.java.version: '21.0.12.1'
      b:
        attrs:
          tool.java.version: '25.0.4.1'
status: active
