schema: 1
id: gradle-9-0-project-exec-javaexec-removed
title: Project.exec and Project.javaexec are removed in Gradle 9.0
applies:
  - build
difference: >-
  side a is Gradle below 9.0.0; side b is Gradle 9.0.0 or later with a build script that calls Project.exec or Project.javaexec
symptoms:
  - text: >-
      a build script that calls Project.exec or Project.javaexec fails on Gradle 9.0 (inferred; the error text is not quoted)
    basis: inferred
mechanism: >-
  The Project.exec and Project.javaexec methods are deprecated and will be removed in Gradle 9.0.
detect:
  all:
    - a: project.gradle.wrapper
      ver: '<9.0.0'
    - b: project.gradle.wrapper
      ver: '>=9.0.0'
    - b: project.gradle.calls.project-exec
      present: 'true'
severity: high
provenance:
  - url: https://docs.gradle.org/9.0.0/userguide/upgrading_version_8.html
    kind: vendor-doc
    verified: '2026-10-13'
    section: Deprecated Project#exec and Project#javaexec
fixtures:
  positive:
    - name: gradle 8.14.3 to gradle 9.0.0 with project exec calls
      a:
        attrs:
          project.gradle.wrapper: '8.14.3'
      b:
        attrs:
          project.gradle.wrapper: '9.0.0'
          project.gradle.calls.project-exec: 'true'
  negative:
    - name: gradle 9.0.0 without project exec calls
      a:
        attrs:
          project.gradle.wrapper: '8.14.3'
      b:
        attrs:
          project.gradle.wrapper: '9.0.0'
    - name: gradle 8.14.3 to gradle 8.14.3 with project exec calls
      a:
        attrs:
          project.gradle.wrapper: '8.14.3'
          project.gradle.calls.project-exec: 'true'
      b:
        attrs:
          project.gradle.wrapper: '8.14.3'
          project.gradle.calls.project-exec: 'true'
status: active
