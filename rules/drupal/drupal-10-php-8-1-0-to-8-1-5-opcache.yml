schema: 1
id: drupal-10-php-8-1-0-to-8-1-5-opcache
title: PHP 8.1.0 to 8.1.5 has an OPcache bug; Drupal 10 recommends PHP 8.1.6 or later
applies:
  - runtime
difference: >-
  side a is PHP 8.1.6 or later; side b is PHP 8.1.0 to 8.1.5 (the bug window) on a Drupal 10 site; the
  same Drupal 10 code runs on both sides
symptoms:
  - text: intermittent fatal errors at runtime, shown in class autoloading
    basis: verified
mechanism: >-
  The Drupal 10.0.0 release notes state that PHP 8.1.0 through 8.1.5 has an OPcache bug, so PHP 8.1.6 or higher is recommended.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.1.6,<8.2'
    - b: tool.php.version
      ver: '>=8.1.0,<8.1.6'
    - b: project.composer.drupal/core
      ver: '>=10'
severity: medium
provenance:
  - url: https://www.drupal.org/project/drupal/releases/10.0.0
    kind: release-note
    verified: '2026-10-13'
    section: Platform requirements changes
fixtures:
  positive:
    - name: php 8.1.34 to php 8.1.5 on drupal 10.3.6
      a: {attrs: {tool.php.version: '8.1.34', project.composer.drupal/core: '10.3.6'}}
      b: {attrs: {tool.php.version: '8.1.5', project.composer.drupal/core: '10.3.6'}}
  negative:
    - name: php 8.1.5 to php 8.1.34 on drupal 10.3.6 (reverse direction)
      a: {attrs: {tool.php.version: '8.1.5', project.composer.drupal/core: '10.3.6'}}
      b: {attrs: {tool.php.version: '8.1.34', project.composer.drupal/core: '10.3.6'}}
    - name: php 8.1.34 to php 8.1.5 on drupal 9.5.0 (not a drupal 10 site)
      a: {attrs: {tool.php.version: '8.1.34', project.composer.drupal/core: '9.5.0'}}
      b: {attrs: {tool.php.version: '8.1.5', project.composer.drupal/core: '9.5.0'}}
status: active
