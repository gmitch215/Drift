schema: 1
id: laravel-9-php-8-0-2-minimum
title: Laravel 9 declares PHP 8.0.2 or higher, so a PHP below 8.0.2 host cannot install it
applies:
  - build
difference: >-
  side a is PHP 8.0.2 or higher with Laravel 9; side b is PHP below 8.0.2 with the same release line
symptoms:
  - text: 'laravel/framework[v9.0.0, ..., v9.52.22] require php ^8.0.2 -> your php version (8.0.1) does not satisfy that requirement'
    basis: verified
mechanism: The composer.json of Laravel 9 at tag v9.0.0 requires php ^8.0.2.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.0.2'
    - b: tool.php.version
      ver: '<8.0.2'
    - a: project.composer.laravel/framework
      ver: '>=9,<10'
    - b: project.composer.laravel/framework
      ver: '>=9,<10'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/laravel/framework/v9.0.0/composer.json
    kind: spec
    verified: '2026-10-15'
    section: 'require.php'
fixtures:
  positive:
    - name: php 8.3.12 to php 8.0.1 with laravel/framework 9.52.16
      a: {attrs: {tool.php.version: '8.3.12', project.composer.laravel/framework: '9.52.16'}}
      b: {attrs: {tool.php.version: '8.0.1', project.composer.laravel/framework: '9.52.16'}}
  negative:
    - name: php 8.0.1 to php 8.3.12 with laravel/framework 9.52.16 (reverse direction)
      a: {attrs: {tool.php.version: '8.0.1', project.composer.laravel/framework: '9.52.16'}}
      b: {attrs: {tool.php.version: '8.3.12', project.composer.laravel/framework: '9.52.16'}}
    - name: php 8.3.12 to php 8.0.1 with laravel/framework 8.54.0 (outside the release line)
      a: {attrs: {tool.php.version: '8.3.12', project.composer.laravel/framework: '8.54.0'}}
      b: {attrs: {tool.php.version: '8.0.1', project.composer.laravel/framework: '8.54.0'}}
    - name: php 8.0.1 to php 8.0.1 with laravel/framework 9.52.16 (same band)
      a: {attrs: {tool.php.version: '8.0.1', project.composer.laravel/framework: '9.52.16'}}
      b: {attrs: {tool.php.version: '8.0.1', project.composer.laravel/framework: '9.52.16'}}
status: active
