schema: 1
id: laravel-13-php-8-3-minimum
title: Laravel 13 declares PHP 8.3 or higher, so a PHP below 8.3 host cannot install it
applies:
  - build
difference: >-
  side a is PHP 8.3 or higher with Laravel 13; side b is PHP below 8.3 with the same release line
symptoms:
  - text: 'laravel/framework[v13.0.0, ..., v13.36.0] require php ^8.3 -> your php version (8.2.25) does not satisfy that requirement'
    basis: verified
mechanism: The composer.json of Laravel 13 at tag v13.0.0 requires php ^8.3.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.3'
    - b: tool.php.version
      ver: '<8.3'
    - a: project.composer.laravel/framework
      ver: '>=13,<14'
    - b: project.composer.laravel/framework
      ver: '>=13,<14'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/laravel/framework/v13.0.0/composer.json
    kind: spec
    verified: '2026-10-15'
    section: 'require.php'
fixtures:
  positive:
    - name: php 8.4.1 to php 8.2.25 with laravel/framework 13.0.0
      a: {attrs: {tool.php.version: '8.4.1', project.composer.laravel/framework: '13.0.0'}}
      b: {attrs: {tool.php.version: '8.2.25', project.composer.laravel/framework: '13.0.0'}}
  negative:
    - name: php 8.2.25 to php 8.4.1 with laravel/framework 13.0.0 (reverse direction)
      a: {attrs: {tool.php.version: '8.2.25', project.composer.laravel/framework: '13.0.0'}}
      b: {attrs: {tool.php.version: '8.4.1', project.composer.laravel/framework: '13.0.0'}}
    - name: php 8.4.1 to php 8.2.25 with laravel/framework 12.9.0 (outside the release line)
      a: {attrs: {tool.php.version: '8.4.1', project.composer.laravel/framework: '12.9.0'}}
      b: {attrs: {tool.php.version: '8.2.25', project.composer.laravel/framework: '12.9.0'}}
    - name: php 8.2.25 to php 8.2.25 with laravel/framework 13.0.0 (same band)
      a: {attrs: {tool.php.version: '8.2.25', project.composer.laravel/framework: '13.0.0'}}
      b: {attrs: {tool.php.version: '8.2.25', project.composer.laravel/framework: '13.0.0'}}
status: active
