schema: 1
id: laravel-11-php-8-2-minimum
title: Laravel 11 and 12 declares PHP 8.2 or higher, so a PHP below 8.2 host cannot install it
applies:
  - build
difference: >-
  side a is PHP 8.2 or higher with Laravel 11 and 12; side b is PHP below 8.2 with the same release line
symptoms:
  - text: 'laravel/framework[v11.0.0, ..., v11.57.0] require php ^8.2 -> your php version (8.1.27) does not satisfy that requirement'
    basis: verified
mechanism: The composer.json of Laravel 11 and 12 at tag v11.0.0 requires php ^8.2.
detect:
  all:
    - a: tool.php.version
      ver: '>=8.2'
    - b: tool.php.version
      ver: '<8.2'
    - a: project.composer.laravel/framework
      ver: '>=11,<13'
    - b: project.composer.laravel/framework
      ver: '>=11,<13'
severity: high
provenance:
  - url: https://raw.githubusercontent.com/laravel/framework/v11.0.0/composer.json
    kind: spec
    verified: '2026-10-15'
    section: 'require.php'
fixtures:
  positive:
    - name: php 8.4.1 to php 8.1.27 with laravel/framework 11.31.0
      a: {attrs: {tool.php.version: '8.4.1', project.composer.laravel/framework: '11.31.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.laravel/framework: '11.31.0'}}
  negative:
    - name: php 8.1.27 to php 8.4.1 with laravel/framework 11.31.0 (reverse direction)
      a: {attrs: {tool.php.version: '8.1.27', project.composer.laravel/framework: '11.31.0'}}
      b: {attrs: {tool.php.version: '8.4.1', project.composer.laravel/framework: '11.31.0'}}
    - name: php 8.4.1 to php 8.1.27 with laravel/framework 10.48.0 (outside the release line)
      a: {attrs: {tool.php.version: '8.4.1', project.composer.laravel/framework: '10.48.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.laravel/framework: '10.48.0'}}
    - name: php 8.1.27 to php 8.1.27 with laravel/framework 11.31.0 (same band)
      a: {attrs: {tool.php.version: '8.1.27', project.composer.laravel/framework: '11.31.0'}}
      b: {attrs: {tool.php.version: '8.1.27', project.composer.laravel/framework: '11.31.0'}}
status: active
