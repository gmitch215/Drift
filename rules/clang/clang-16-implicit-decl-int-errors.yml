schema: 1
id: clang-16-implicit-decl-int-errors
title: Clang 16 makes implicit declarations and incompatible function pointers errors in C
applies:
  - compiler
difference: >-
  the C compiler is LLVM Clang 16 or newer on the failing side and LLVM Clang 15 or older on the
  passing side (Apple clang is excluded); the C language mode is C99, C11 or C17
symptoms:
  - text: 'implicit function declaration and implicit int are reported as errors'
    basis: verified
  - text: >-
      incompatible function pointer conversions are reported as errors in every C language mode
    basis: verified
mechanism: >-
  Clang 16 defaults -Wimplicit-function-declaration and -Wimplicit-int to errors in C99, C11
  and C17, and -Wincompatible-function-pointer-types to an error in all C modes.
detect:
  all:
    - a: tool.cc.family
      eq: clang
    - b: tool.cc.family
      eq: clang
    - a: tool.cc.vendor
      eq: llvm
    - b: tool.cc.vendor
      eq: llvm
    - a: tool.cc.version
      ver: '<16'
    - b: tool.cc.version
      ver: '>=16'
severity: high
provenance:
  - url: https://releases.llvm.org/16.0.0/tools/clang/docs/ReleaseNotes.html
    kind: release-note
    verified: '2026-10-13'
    section: 'Potentially Breaking Changes'
fixtures:
  positive:
    - name: LLVM clang 15.0.0 to LLVM clang 16.0.0
      a:
        attrs:
          tool.cc.family: clang
          tool.cc.vendor: llvm
          tool.cc.version: '15.0.0'
      b:
        attrs:
          tool.cc.family: clang
          tool.cc.vendor: llvm
          tool.cc.version: '16.0.0'
  negative:
    - name: LLVM clang 16.0.0 to LLVM clang 18.1.3
      a:
        attrs:
          tool.cc.family: clang
          tool.cc.vendor: llvm
          tool.cc.version: '16.0.0'
      b:
        attrs:
          tool.cc.family: clang
          tool.cc.vendor: llvm
          tool.cc.version: '18.1.3'
    - name: Apple clang 15.0.0 to Apple clang 17.0.0 (Apple numbering)
      a:
        attrs:
          tool.cc.family: clang
          tool.cc.vendor: apple
          tool.cc.version: '15.0.0'
      b:
        attrs:
          tool.cc.family: clang
          tool.cc.vendor: apple
          tool.cc.version: '17.0.0'
status: active
