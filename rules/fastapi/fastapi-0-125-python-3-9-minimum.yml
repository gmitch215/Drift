schema: 1
id: fastapi-0-125-python-3-9-minimum
title: FastAPI 0.125 to 0.128 requires Python 3.9 or newer, so a Python below 3.9 host cannot install it
applies:
  - build
difference: >-
  side a is Python 3.9 or newer with FastAPI 0.125 to 0.128; side b is Python below 3.9 with the same release line
symptoms:
  - text: 'ERROR: No matching distribution found for fastapi==0.125.0 (pip lists the release line under "Ignored the following versions that require a different python version")'
    basis: verified
mechanism: PyPI metadata for fastapi 0.125.0 gives requires_python ">=3.9" and the later releases of the line keep it.
detect:
  all:
    - a: tool.python.version
      ver: '>=3.9'
    - b: tool.python.version
      ver: '<3.9'
    - a: project.python.fastapi
      ver: '>=0.125,<0.129'
    - b: project.python.fastapi
      ver: '>=0.125,<0.129'
severity: high
provenance:
  - url: https://pypi.org/pypi/fastapi/0.125.0/json
    kind: spec
    verified: '2026-10-15'
    section: 'info.requires_python'
fixtures:
  positive:
    - name: python 3.11.9 to python 3.8.18 with fastapi 0.126.0
      a: {attrs: {tool.python.version: '3.11.9', project.python.fastapi: '0.126.0'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.fastapi: '0.126.0'}}
  negative:
    - name: python 3.8.18 to python 3.11.9 with fastapi 0.126.0 (reverse direction)
      a: {attrs: {tool.python.version: '3.8.18', project.python.fastapi: '0.126.0'}}
      b: {attrs: {tool.python.version: '3.11.9', project.python.fastapi: '0.126.0'}}
    - name: python 3.11.9 to python 3.8.18 with fastapi 0.124.0 (outside the release line)
      a: {attrs: {tool.python.version: '3.11.9', project.python.fastapi: '0.124.0'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.fastapi: '0.124.0'}}
    - name: python 3.8.18 to python 3.8.18 with fastapi 0.126.0 (same band)
      a: {attrs: {tool.python.version: '3.8.18', project.python.fastapi: '0.126.0'}}
      b: {attrs: {tool.python.version: '3.8.18', project.python.fastapi: '0.126.0'}}
status: active
