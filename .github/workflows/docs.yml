name: Deploy Documentation

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build Documentation
        run: ./gradlew dokkaGenerate atlasSite docsSite
      - name: Check Site Layout
        run: |
          site=build/site
          for file in index.html advanced-usage.html technical-report.html \
            atlas/index.html atlas/probe/index.html atlas/data/dataset.json engine/index.html \
            drift.png drift_128.png drift.ico .nojekyll CNAME; do
            test -f "$site/$file" || { echo "missing $site/$file"; exit 1; }
          done
          test "$(cat "$site/CNAME")" = "drift.gmitch215.dev"
          if find "$site" \( -name build -o -name .gradle -o -name .kotlin -o -name '*.kexe' \) | grep -q .; then
            echo "build output inside the site"
            exit 1
          fi
      - name: Deploy Documentation
        if: github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$RUNNER_TEMP/pages" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/pages"
          fi
          cd "$RUNNER_TEMP/pages"
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/build/site/." .
          git add .
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update documentation (${GITHUB_SHA::7})"
            git push -f origin gh-pages
          fi
      - name: Stop Gradle
        run: ./gradlew --stop
