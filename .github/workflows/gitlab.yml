name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to GitLab
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: ${{ github.repository == 'gmitch215/Drift' }}

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Check GitLab Token
        id: token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the GITLAB_TOKEN secret is not available; skipping the mirror"
          fi
      - name: Clone Repository
        if: steps.token.outputs.present == 'true'
        run: git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" mirror
      - name: Push to GitLab
        if: steps.token.outputs.present == 'true'
        working-directory: mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --prune "https://oauth2:${GITLAB_TOKEN}@gitlab.com/gmitch215/Drift.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
