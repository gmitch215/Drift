name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to GitLab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.repository == 'gmitch215/Drift' }}

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Require GitLab Token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: test -n "$GITLAB_TOKEN" || { echo "::error::the GITLAB_TOKEN secret is not set"; exit 1; }
      - name: Clone Repository
        run: git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" mirror
      - name: Push to GitLab
        working-directory: mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --prune "https://oauth2:${GITLAB_TOKEN}@gitlab.com/gmitch215/Drift.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
