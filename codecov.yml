coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 85%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: jvm
      paths:
        - '*/src/common/main/'
        - '*/src/jvm/main/'

ignore:
  - '*/src/*/test/**/*'
  - 'build-core/**/*'
  - 'tools/**/*'
  - 'fixtures/**/*'
  - '**/build/**/*'
  - '**/generated/**/*'
